                        ['ems', 'onduleur', 'utilisation', 'plafond']
                      ),

                    potential:
                      findFox(
                        'sensor',
                        ['ems', 'onduleur', 'potentiel', 'solaire']
                      ),

                    priCurrent:
                      findFox(
                        'sensor',
                        ['niveau', 'puissance', 'pri', 'actuel']
                      ),

                    priTarget:
                      findFox(
                        'sensor',
                        ['niveau', 'puissance', 'pri', 'cible']
                      ),

                    direction:
                      findFox(
                        'sensor',
                        ['direction', 'pri']
                      ),

                    code:
                      findFox(
                        'sensor',
                        ['code', 'rrcr']
                      ),

                    ackRrcr:
                      findFox(
                        'sensor',
                        ['ack', 'rrcr']
                      ),

                    ackInverter:
                      findFox(
                        'sensor',
                        ['ack', 'onduleur']
                      ),

                    ackGrid:
                      findFox(
                        'sensor',
                        ['ack', 'reseau']
                      ),

                    reason:
                      findFox(
                        'sensor',
                        ['derniere', 'decision', 'pri']
                      ),

                    lastFrame:
                      findFox(
                        'sensor',
                        ['derniere', 'trame', 'energetique']
                      )
                  };


                  /* ============================================
                     VALEURS
                     ============================================ */

                  const pv =
                    Math.max(
                      numberOf(E.pv),
                      0
                    );

                  const gridExport =
                    Math.max(
                      numberOf(E.export),
                      0
                    );

                  const gridImport =
                    Math.max(
                      numberOf(E.import),
                      0
                    );

                  const current =
                    clamp(
                      numberOf(E.priCurrent, 100),
                      0,
                      100
                    );

                  const target =
                    clamp(
                      numberOf(E.priTarget, current),
                      0,
                      100
                    );

                  const ceiling =
                    Math.max(
                      numberOf(E.ceiling),
                      0
                    );

                  const ceilingUse =
                    clamp(
                      numberOf(E.ceilingUse),
                      0,
                      100
                    );

                  const state =
                    stateOf(
                      E.inverterState,
                      '—'
                    );

                  const direction =
                    stateOf(
                      E.direction,
                      'MAINTIEN'
                    );

                  const potential =
                    stateOf(
                      E.potential,
                      'STABLE'
                    );

                  const policy =
                    stateOf(
                      E.policy,
                      'Compensation'
                    );

                  const rrcrCode =
                    stateOf(
                      E.code,
                      '—'
                    );

                  const ackRrcr =
                    stateOf(
                      E.ackRrcr,
                      '—'
                    );

                  const ackInverter =
                    stateOf(
                      E.ackInverter,
                      '—'
                    );

                  const ackGrid =
                    stateOf(
                      E.ackGrid,
                      '—'
                    );

                  const reason =
                    stateOf(
                      E.reason,
                      'Aucune décision disponible.'
                    );

                  const lastFrame =
                    stateOf(
                      E.lastFrame,
                      '—'
                    );


                  /* ============================================
                     COULEURS
                     ============================================ */

                  const stateNorm =
                    norm(state);

                  let stateColor =
                    '#94a3b8';

                  if (
                    stateNorm.includes('liberation')
                  )
                    stateColor = '#35e59d';

                  else if (
                    stateNorm.includes('reduction')
                  )
                    stateColor = '#ff922b';

                  else if (
                    stateNorm.includes('maintien')
                  )
                    stateColor = '#19d8ff';

                  else if (
                    stateNorm.includes('invalide') ||
                    stateNorm.includes('failed')
                  )
                    stateColor = '#fb7185';


                  const potentialNorm =
                    norm(potential);

                  let potentialColor =
                    '#94a3b8';

                  if (
                    potentialNorm.includes('plus possible')
                  )
                    potentialColor = '#35e59d';

                  else if (
                    potentialNorm.includes('max solaire')
                  )
                    potentialColor = '#ff922b';

