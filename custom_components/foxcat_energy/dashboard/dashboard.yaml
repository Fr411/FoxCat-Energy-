                     ========================================================== */

                  const nativeApplianceSensor = (
                    device,
                    metricWords,
                    rejected = []
                  ) => {

                    for (
                      const deviceWord
                      of device.nativeNames
                    ) {

                      const id =
                        findFox(
                          'sensor',
