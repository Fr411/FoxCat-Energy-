                    ('1' if is_state('[[foxcat:inverter.rrcr_l2]]','on') else '0')
                    ~
                    ('1' if is_state('[[foxcat:inverter.rrcr_l1]]','on') else '0')
                  %}
                  {% set table = {
                    '0000': 100,
                    '0001': 10,
                    '0010': 20,
                    '0011': 30,
                    '0100': 40,
                    '0101': 50,
                    '0110': 60,
                    '0111': 70,
                    '1000': 80,
                    '1001': 90,
                    '1010': 0
                  } %}
                  {% set niveau = table.get(code, -1) %}
