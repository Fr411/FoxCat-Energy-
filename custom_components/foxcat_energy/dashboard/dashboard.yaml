      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_state: false
            show_icon: false
            grid_options:
              columns: full
            custom_fields:
              panel: |
                [[[
                  // =========================================================
                  // CONFIGURATION DES UNITÉS
                  // =========================================================

                  const units = [

                    {
                      name: 'Salon',
                      icon: '🛋️',
                      entity: '[[foxcat:legacy.climate_salon_2]]',
                      slope: null
                    },

                    {
                      name: 'Chambre parentale',
                      icon: '🛏️',
                      entity: '[[foxcat:legacy.climate_chambre_parentale]]',
                      slope: '[[foxcat:legacy.sensor_chambre_parentale_temperature_slope]]'
                    },

                    {
                      name: 'Chambre Nathéo',
                      icon: '🧸',
                      entity: '[[foxcat:legacy.climate_chambre_natheo_2]]',
                      slope: '[[foxcat:legacy.sensor_chambre_natheo_temperature_slope]]'
                    },

                    {
                      name: 'Salle de bain',
                      icon: '🚿',
                      entity: '[[foxcat:legacy.climate_salle_de_bain_2]]',
                      slope: '[[foxcat:legacy.sensor_salle_de_bain_temperature_slope]]'
                    },

                    {
                      name: 'Chauffage sol',
                      icon: '♨️',
                      entity: '[[foxcat:legacy.climate_chauffage_sol_2]]',
                      slope: null
                    },

                    {
                      name: 'Insert a Pellet',
                      icon: '🍳',
                      entity: '[[foxcat:legacy.climate_poele_a_pellet]]',
                      slope: null
                    }

                  ];


                  // =========================================================
                  // FONCTIONS
                  // =========================================================

                  function info(unit) {

                    const st = states[unit.entity];

                    if (!st) {
                      return {
                        available: false,
                        name: unit.name,
                        icon: unit.icon,
                        state: 'unavailable',
                        action: 'unavailable',
                        current: null,
                        target: null,
                        slope: null
                      };
                    }

                    const action =
                      st.attributes?.hvac_action || 'idle';

                    const current =
                      parseFloat(
                        st.attributes?.current_temperature
                      );

                    const target =
                      parseFloat(
                        st.attributes?.temperature
                      );

                    let slope = null;

                    if (unit.slope) {

                      const slopeEntity =
                        states[unit.slope];

                      if (slopeEntity) {
                        slope =
                          parseFloat(slopeEntity.state);
                      }

                    } else {

                      const attrSlope =
                        parseFloat(
                          st.attributes?.temperature_slope
                        );

                      if (!isNaN(attrSlope)) {
                        slope = attrSlope;
                      }

                    }

                    return {
                      available: true,
                      name: unit.name,
                      icon: unit.icon,
                      state: st.state,
                      action,
                      current:
                        isNaN(current)
                          ? null
                          : current,
                      target:
                        isNaN(target)
                          ? null
                          : target,
                      slope:
                        isNaN(slope)
                          ? null
                          : slope
                    };
                  }


                  function actionData(action, state) {

                    if (state === 'off') {
                      return {
                        text: 'ARRÊT',
                        icon: '○',
                        color: '#64748b'
                      };
                    }

                    if (action === 'heating') {
                      return {
                        text: 'CHAUFFE',
                        icon: '🔥',
                        color: '#fb923c'
                      };
                    }

                    if (action === 'cooling') {
                      return {
                        text: 'RAFRAÎCHIT',
                        icon: '❄️',
                        color: '#60a5fa'
                      };
                    }

                    if (action === 'drying') {
                      return {
                        text: 'DÉSHUMIDIFIE',
                        icon: '💧',
                        color: '#38bdf8'
                      };
                    }

                    if (
                      action === 'fan' ||
                      action === 'fan_only'
                    ) {
                      return {
                        text: 'VENTILATION',
                        icon: '🌀',
                        color: '#c4b5fd'
                      };
                    }

                    if (action === 'unavailable') {
                      return {
                        text: 'INDISPONIBLE',
                        icon: '⚠️',
                        color: '#ef4444'
                      };
                    }

                    return {
                      text: 'EN VEILLE',
                      icon: '💤',
                      color: '#94a3b8'
                    };
                  }


                  // =========================================================
                  // CALCUL GLOBAL
                  // =========================================================

                  const data =
                    units.map(info);

                  const active =
                    data.filter(x =>
                      [
                        'heating',
                        'cooling',
                        'drying',
                        'fan',
                        'fan_only'
                      ].includes(x.action)
                    );

                  const heating =
                    data.filter(
                      x => x.action === 'heating'
                    ).length;

                  const cooling =
                    data.filter(
                      x => x.action === 'cooling'
                    ).length;

                  const idle =
                    data.filter(
                      x =>
                        x.available &&
                        x.state !== 'off' &&
                        x.action === 'idle'
                    ).length;

                  const off =
                    data.filter(
                      x => x.state === 'off'
                    ).length;

                  const centralMode =
                    states['[[foxcat:legacy.select_central_mode]]']?.state || '-';


                  // =========================================================
                  // MODE CENTRAL
                  // =========================================================

                  let centralText = centralMode;
                  let centralIcon = '⚙️';
                  let centralColor = '#c4b5fd';

                  if (centralMode === 'Auto') {
                    centralText = 'Automatique';
                    centralIcon = '🤖';
                    centralColor = '#c4b5fd';
                  }

                  if (centralMode === 'Stopped') {
                    centralText = 'Arrêt général';
                    centralIcon = '⛔';
                    centralColor = '#64748b';
                  }

                  if (centralMode === 'Heat only') {
                    centralText = 'Chauffage seul';
                    centralIcon = '🔥';
                    centralColor = '#fb923c';
                  }

                  if (centralMode === 'Cool only') {
                    centralText = 'Rafraîchissement seul';
                    centralIcon = '❄️';
                    centralColor = '#60a5fa';
                  }

                  if (centralMode === 'Frost protection') {
                    centralText = 'Protection hors gel';
                    centralIcon = '🧊';
                    centralColor = '#38bdf8';
                  }


                  // =========================================================
                  // GÉNÉRATION DES UNITÉS
                  // =========================================================

                  const rows = data.map(x => {

                    const a =
                      actionData(
                        x.action,
                        x.state
                      );

                    const currentText =
                      x.current !== null
                        ? `${x.current.toFixed(1)}°`
                        : '--';

                    const targetText =
                      x.target !== null
                        ? `${x.target.toFixed(1)}°`
                        : '--';

                    let slopeHtml = '';

                    if (x.slope !== null) {

                      let slopeColor = '#94a3b8';
                      let slopeIcon = '→';

                      if (x.slope > 0.01) {
                        slopeColor = '#fb923c';
                        slopeIcon = '↗';
                      }

                      if (x.slope < -0.01) {
                        slopeColor = '#60a5fa';
                        slopeIcon = '↘';
                      }

                      slopeHtml = `
                        <div style="
                          margin-top:7px;
                          font-size:9px;
                          color:${slopeColor};
                          opacity:.75;
                        ">
                          ${slopeIcon}
                          ${x.slope.toFixed(3)} °C/min
                        </div>
                      `;
                    }

                    return `
                      <div style="
                        width:100%;
                        min-width:0;
                        box-sizing:border-box;

                        padding:20px 15px;

                        border-radius:22px;

                        text-align:center;

                        background:
                          radial-gradient(
                            circle at 50% 0%,
                            ${a.color}12,
                            transparent 55%
                          ),
                          rgba(255,255,255,.025);

                        border:
                          1px solid ${a.color}25;
                      ">

                        <!-- ICONE -->

                        <div style="
                          width:50px;
                          height:50px;

                          margin:0 auto;

                          display:flex;
                          align-items:center;
                          justify-content:center;

                          border-radius:16px;

                          background:${a.color}12;

                          font-size:25px;
                        ">
                          ${x.icon}
                        </div>


                        <!-- NOM -->

                        <div style="
                          margin-top:11px;

                          font-size:17px;
                          font-weight:900;

                          color:white;
                        ">
                          ${x.name}
                        </div>


                        <!-- ETAT -->

                        <div style="
                          margin-top:8px;

                          display:flex;
                          justify-content:center;
                          align-items:center;

                          gap:5px;

                          font-size:9px;
                          font-weight:900;

                          color:${a.color};
                        ">

                          <span style="
                            width:6px;
                            height:6px;

                            border-radius:50%;

                            background:${a.color};

                            box-shadow:${
                              active.includes(x)
                                ? `0 0 9px ${a.color}`
                                : 'none'
                            };
                          ">
                          </span>

                          ${a.icon}
                          ${a.text}

                        </div>


                        <!-- TEMP -->

                        <div style="
                          margin-top:16px;

                          font-size:32px;
                          line-height:1;

                          font-weight:900;
                        ">
                          ${currentText}
                        </div>

                        <div style="
                          margin-top:5px;

                          font-size:8px;
                          letter-spacing:.08em;

                          opacity:.35;
                        ">
                          TEMPÉRATURE
                        </div>


                        <!-- CONSIGNE -->

                        <div style="
                          margin-top:13px;

                          padding:10px;

                          border-radius:14px;

                          background:
                            rgba(255,255,255,.035);

                          border:
                            1px solid rgba(255,255,255,.05);
                        ">

                          <div style="
                            font-size:9px;
                            opacity:.4;
                          ">
                            CONSIGNE
                          </div>

                          <div style="
                            margin-top:3px;

                            font-size:17px;
                            font-weight:900;

                            color:${a.color};
                          ">
                            ${targetText}
                          </div>

                        </div>

                        ${slopeHtml}

                      </div>
                    `;

                  }).join('');


                  // =========================================================
                  // HTML FINAL
                  // =========================================================

                  return `

                    <div style="
                      width:100%;
                      box-sizing:border-box;

                      padding:24px;

                      border-radius:30px;

                      color:white;

                      background:
                        radial-gradient(
                          circle at 100% 0%,
                          rgba(139,92,246,.13),
                          transparent 38%
                        ),
                        radial-gradient(
                          circle at 0% 100%,
                          rgba(59,130,246,.10),
                          transparent 40%
                        ),
                        linear-gradient(
                          145deg,
                          #070b14,
                          #101827 55%,
                          #080d16
                        );

                      border:
                        1px solid rgba(255,255,255,.07);

                      box-shadow:
                        inset 0 1px 0 rgba(255,255,255,.06),
                        0 20px 55px rgba(0,0,0,.35);
                    ">


                      <!-- ==================================================
                           TITRE
                           ================================================== -->

                      <div style="
                        text-align:center;
                      ">

                        <div style="
                          font-size:27px;
                          font-weight:900;
                          letter-spacing:.07em;
                        ">
                          🌡️ CHAUFFAGE & CLIMATISATION
                        </div>

                        <div style="
                          margin-top:5px;

                          font-size:9px;
                          font-weight:700;

                          letter-spacing:.16em;

                          opacity:.4;
                        ">
                          HOMEFOXCAT ENERGY · SUPERVISION
                        </div>

                      </div>


                      <!-- ==================================================
                           MODE CENTRAL
                           ================================================== -->

                      <div style="
                        margin-top:20px;

                        padding:15px 17px;

                        display:flex;
                        align-items:center;
                        justify-content:space-between;

                        gap:12px;

                        border-radius:18px;

                        background:${centralColor}0d;

                        border:
                          1px solid ${centralColor}25;
                      ">

                        <div style="
                          text-align:left;
                        ">

                          <div style="
                            font-size:9px;
                            font-weight:800;

                            letter-spacing:.1em;

                            opacity:.4;
                          ">
                            MODE CENTRAL
                          </div>

                          <div style="
                            margin-top:4px;

                            font-size:17px;
                            font-weight:900;

                            color:${centralColor};
                          ">
                            ${centralIcon}
                            ${centralText}
                          </div>

                        </div>

                        <div style="
                          font-size:9px;
                          opacity:.35;
                        ">
                          Lecture seule
                        </div>

                      </div>


                      <!-- ==================================================
                           RÉSUMÉ
                           ================================================== -->

                      <div style="
                        display:grid;

                        grid-template-columns:
                          repeat(4,minmax(0,1fr));

                        gap:8px;

                        margin-top:12px;
                      ">


                        <div style="
                          padding:13px 5px;
                          text-align:center;

                          border-radius:16px;

                          background:
                            rgba(52,211,153,.06);

                          border:
                            1px solid rgba(52,211,153,.12);
                        ">

                          <div style="
                            font-size:23px;
                            font-weight:900;

                            color:#34d399;
                          ">
                            ${active.length}
                          </div>

                          <div style="
                            margin-top:4px;
                            font-size:8px;
                            opacity:.4;
                          ">
                            ACTIVES
                          </div>

                        </div>


                        <div style="
                          padding:13px 5px;
                          text-align:center;

                          border-radius:16px;

                          background:
                            rgba(251,146,60,.06);

                          border:
                            1px solid rgba(251,146,60,.12);
                        ">

                          <div style="
                            font-size:23px;
                            font-weight:900;

                            color:#fb923c;
                          ">
                            ${heating}
                          </div>

                          <div style="
                            margin-top:4px;
                            font-size:8px;
                            opacity:.4;
                          ">
                            CHAUFFE
                          </div>

                        </div>


                        <div style="
                          padding:13px 5px;
                          text-align:center;

                          border-radius:16px;

                          background:
                            rgba(96,165,250,.06);

                          border:
                            1px solid rgba(96,165,250,.12);
                        ">

                          <div style="
                            font-size:23px;
                            font-weight:900;

                            color:#60a5fa;
                          ">
                            ${cooling}
                          </div>

                          <div style="
                            margin-top:4px;
                            font-size:8px;
                            opacity:.4;
                          ">
                            CLIM
                          </div>

                        </div>


                        <div style="
                          padding:13px 5px;
                          text-align:center;

                          border-radius:16px;

                          background:
                            rgba(148,163,184,.05);

                          border:
                            1px solid rgba(148,163,184,.10);
                        ">

                          <div style="
                            font-size:23px;
                            font-weight:900;

                            color:#94a3b8;
                          ">
                            ${idle + off}
                          </div>

                          <div style="
                            margin-top:4px;
                            font-size:8px;
                            opacity:.4;
                          ">
                            REPOS
                          </div>

                        </div>

                      </div>


                      <!-- ==================================================
                           UNITÉS
                           ================================================== -->

                      <div style="
                        display:grid;

                        grid-template-columns:
                          repeat(2,minmax(0,1fr));

                        gap:10px;

                        margin-top:14px;
                      ">

                        ${rows}

                      </div>

                    </div>
                  `;
                ]]]
            styles:
