    path: conf
    icon: mdi:account-cog-outline
    sections:
      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            triggers_update: all
            styles:
              card:
                - padding: 0
                - border-radius: 26px
                - overflow: hidden
                - background: >-
                    linear-gradient(145deg, rgba(7,11,20,.98),
                    rgba(12,22,38,.98))
                - border: 1px solid rgba(255,255,255,.08)
                - box-shadow: 0 16px 38px rgba(0,0,0,.35)
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: 1fr
              custom_fields:
                content:
                  - width: 100%
            custom_fields:
              content: |
                [[[
                  const norm = (v) =>
                    String(v ?? '')
                      .normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '')
                      .toLowerCase()
                      .replace(/[^a-z0-9]+/g, ' ')
                      .trim();

                  const findFox = (
                    domain,
                    words = []
                  ) => {

                    const wanted =
                      words.map(norm);

                    return (
                      Object.keys(states)
                        .filter(
                          id =>
                            id.startsWith(`${domain}.`)
                        )
                        .find(id => {

                          const s =
                            states[id];

                          const text =
                            norm(
                              `${id} ${s?.attributes?.friendly_name || ''}`
                            );

                          const fox =
                            text.includes('foxcat energy') ||
                            norm(id).includes('foxcat energy');

                          return (
                            fox &&
                            wanted.every(
                              word =>
                                text.includes(word)
                            )
                          );
                        })
                      ||
                      null
                    );
                  };


                  const stateOf = (
                    id,
                    fallback = '—'
                  ) => {

                    if (!id || !states[id])
                      return fallback;

                    const v =
                      states[id].state;

                    return (
                      ['unknown','unavailable','none','']
                        .includes(v)
                    )
                      ? fallback
                      : v;
                  };


                  const isOn = id =>
                    id &&
                    states[id]?.state === 'on';


                  /* ============================================
                     CONFIGURATION
                     ============================================ */

                  const modeEntity =
                    findFox(
                      'select',
                      ['mode', 'ems']
                    );

                  const tariffEntity =
                    findFox(
                      'select',
                      ['regime', 'tarifaire']
                    );

                  const networkPolicyEntity =
                    findFox(
                      'select',
                      ['politique', 'reseau']
                    );


                  const regulationEntity =
                    findFox(
                      'switch',
                      ['regulation', 'foxcat', 'active']
                    );

                  const priEnabledEntity =
                    findFox(
                      'switch',
                      ['reduction', 'puissance', 'onduleur']
                    );

                  const boilerEnabledEntity =
                    findFox(
                      'switch',
                      ['boiler', 'gere', 'foxcat']
                    );

                  const solarAdvisorEntity =
                    findFox(
                      'switch',
                      ['conseiller', 'solaire', 'ems', '2']
                    );

                  const highLoadEntity =
                    findFox(
                      'switch',
                      ['delestage', 'haute', 'consommation']
                    );


                  /* ============================================
                     CORE EMS
                     ============================================ */

                  const phaseEntity =
                    findFox(
                      'sensor',
                      ['phase', 'regulation']
                    );

                  const ackEntity =
                    findFox(
                      'sensor',
                      ['validation', 'execution', 'ems']
                    );

                  const coreDecisionEntity =
                    findFox(
                      'sensor',
                      ['derniere', 'decision', 'ems']
                    );

                  const pendingEntity =
                    findFox(
                      'sensor',
                      ['action', 'attente']
                    );

                  const lastActionEntity =
                    findFox(
                      'sensor',
                      ['derniere', 'action', 'ems']
                    );


                  /* ============================================
                     CORE ONDULEUR
                     ============================================ */

                  const inverterStateEntity =
                    findFox(
                      'sensor',
                      ['ems', 'onduleur', 'etat']
                    );

                  const inverterDecisionEntity =
                    findFox(
                      'sensor',
                      ['derniere', 'decision', 'pri']
                    );

                  const priCurrentEntity =
                    findFox(
                      'sensor',
                      ['niveau', 'pri', 'actuel']
                    );

                  const priTargetEntity =
                    findFox(
                      'sensor',
                      ['niveau', 'pri', 'cible']
                    );

                  const inverterPotentialEntity =
                    findFox(
                      'sensor',
                      ['ems', 'onduleur', 'potentiel']
                    );


                  /* ============================================
                     TARIFICATION
                     ============================================ */

                  const tariffActiveEntity =
                    findFox(
                      'sensor',
                      ['regime', 'tarifaire', 'actif']
                    );

                  const tariffPeriodEntity =
                    findFox(
                      'sensor',
                      ['periode', 'tarifaire']
                    );

                  const priceStatusEntity =
                    findFox(
                      'sensor',
                      ['statut', 'prix']
                    );

                  const activePriceEntity =
                    findFox(
                      'sensor',
                      ['prix', 'achat', 'actif']
                    );

                  const policyActiveEntity =
                    findFox(
                      'sensor',
                      ['politique', 'reseau', 'active']
                    );


                  /* ============================================
                     VALEURS
                     ============================================ */

                  const mode =
                    stateOf(
                      modeEntity,
                      '—'
                    );

                  const tariff =
                    stateOf(
                      tariffEntity,
                      stateOf(
                        tariffActiveEntity,
                        '—'
                      )
                    );

                  const policy =
                    stateOf(
                      networkPolicyEntity,
                      stateOf(
                        policyActiveEntity,
                        '—'
                      )
                    );

                  const tariffPeriod =
                    stateOf(
                      tariffPeriodEntity,
                      '—'
                    );

                  const priceStatus =
                    stateOf(
                      priceStatusEntity,
                      '—'
                    );

                  const activePrice =
                    parseFloat(
                      stateOf(
                        activePriceEntity,
                        '0'
                      )
                    ) || 0;


                  const phase =
                    stateOf(
                      phaseEntity,
                      '—'
                    );

                  const coreAck =
                    stateOf(
                      ackEntity,
                      '—'
                    );

                  const coreDecision =
                    stateOf(
                      coreDecisionEntity,
                      'Aucune décision EMS.'
                    );

                  const pending =
                    stateOf(
                      pendingEntity,
                      'Aucune'
                    );

                  const lastAction =
                    stateOf(
                      lastActionEntity,
                      '—'
                    );


                  const inverterState =
                    stateOf(
                      inverterStateEntity,
                      '—'
                    );

                  const inverterDecision =
                    stateOf(
                      inverterDecisionEntity,
                      'Aucune décision onduleur.'
                    );

                  const priCurrent =
                    parseFloat(
                      stateOf(
                        priCurrentEntity,
                        '100'
                      )
                    ) || 0;

                  const priTarget =
                    parseFloat(
                      stateOf(
                        priTargetEntity,
                        String(priCurrent)
                      )
                    ) || 0;

                  const inverterPotential =
                    stateOf(
                      inverterPotentialEntity,
                      '—'
                    );


                  /* ============================================
                     COULEURS
                     ============================================ */

                  const booleanState = (
                    entity,
                    labelOn = 'ACTIF',
                    labelOff = 'INACTIF'
                  ) => {

                    const active =
                      isOn(entity);

                    return {
                      active,
                      text:
                        active
                          ? labelOn
                          : labelOff,

                      color:
                        active
                          ? '#35e59d'
                          : '#64748b'
                    };
                  };


                  const regulation =
                    booleanState(
                      regulationEntity
                    );

                  const priEnabled =
                    booleanState(
                      priEnabledEntity
                    );

                  const boilerEnabled =
                    booleanState(
                      boilerEnabledEntity
                    );

                  const advisor =
                    booleanState(
                      solarAdvisorEntity
                    );

                  const highLoad =
                    booleanState(
                      highLoadEntity
                    );


                  let modeColor =
                    '#19d8ff';

                  if (
                    norm(mode).includes('economie')
                  )
                    modeColor = '#35e59d';

                  else if (
                    norm(mode).includes('zero')
                  )
                    modeColor = '#fb7185';

                  else if (
                    norm(mode).includes('ecs')
                  )
                    modeColor = '#ff922b';

                  else if (
                    norm(mode).includes('dynamique')
                  )
                    modeColor = '#a78bfa';

                  else if (
                    norm(mode).includes('manuel')
                  )
                    modeColor = '#60a5fa';


                  let tariffColor =
                    '#19d8ff';

                  if (
                    norm(tariff).includes('dynamique')
                  )
                    tariffColor = '#a78bfa';

                  else if (
                    norm(tariffPeriod).includes('hp')
                  )
                    tariffColor = '#ff922b';


                  let policyColor =
                    '#35e59d';

                  if (
                    norm(policy).includes('injection facturee')
                  )
                    policyColor = '#facc15';


                  return `

                    <style>

                      * {
                        box-sizing:border-box;
                      }

                      .wrap {
                        padding:22px;
                        color:#f8fafc;
                        font-family:
                          -apple-system,
                          BlinkMacSystemFont,
                          "Segoe UI",
                          Roboto,
                          sans-serif;
                      }

                      .header {
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        gap:15px;
                        margin-bottom:17px;
                      }

                      .brand {
                        display:flex;
                        align-items:center;
                        gap:12px;
                      }

                      .logo {
                        width:48px;
                        height:48px;
                        display:flex;
                        align-items:center;
                        justify-content:center;
                        border-radius:15px;
                        color:#19d8ff;
                        background:rgba(25,216,255,.07);
                        border:1px solid rgba(25,216,255,.14);
                      }

                      .logo ha-icon {
                        --mdc-icon-size:26px;
                      }

                      .brand-small {
                        color:#19d8ff;
                        font-size:8px;
                        font-weight:900;
                        letter-spacing:2px;
                      }

                      .title {
                        margin-top:3px;
                        font-size:22px;
                        font-weight:950;
                      }

                      .subtitle {
                        margin-top:3px;
                        color:#64748b;
                        font-size:7px;
                      }

                      .live {
                        padding:8px 11px;
                        border-radius:13px;
                        color:${regulation.color};
                        background:${regulation.color}0d;
                        border:1px solid ${regulation.color}25;
                        font-size:8px;
                        font-weight:900;
                      }


                      /* CONFIG */

                      .config-grid {
                        display:grid;
                        grid-template-columns:
                          repeat(3,minmax(0,1fr));
                        gap:8px;
                      }

                      .config {
                        padding:14px;
                        border-radius:16px;
                        background:rgba(255,255,255,.022);
                        border:1px solid rgba(255,255,255,.05);
                      }

                      .config-label {
                        color:#64748b;
                        font-size:6px;
                        font-weight:900;
                        letter-spacing:.08em;
                      }

                      .config-value {
                        margin-top:5px;
                        font-size:12px;
                        font-weight:950;
                      }

                      .config-sub {
                        margin-top:3px;
                        color:#475569;
                        font-size:6px;
                      }


                      /* SECTION */

                      .section-title {
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        margin:19px 1px 9px;
                        color:#718096;
                        font-size:7px;
                        font-weight:900;
                        letter-spacing:.14em;
                      }

                      .section-title span {
                        color:#475569;
                        font-size:6px;
                      }


                      /* DEUX CORES */

                      .cores {
                        display:grid;
                        grid-template-columns:1fr 1fr;
                        gap:10px;
                      }

                      .core {
                        padding:16px;
                        border-radius:18px;
                        background:rgba(255,255,255,.022);
                        border:1px solid rgba(255,255,255,.05);
                      }

                      .core.ems {
                        border-color:rgba(25,216,255,.10);
                      }

                      .core.inverter {
                        border-color:rgba(250,204,21,.10);
                      }

                      .core-head {
                        display:flex;
                        justify-content:space-between;
                        align-items:center;
                        gap:10px;
                      }

                      .core-name {
                        font-size:11px;
                        font-weight:950;
                      }

                      .core-type {
                        color:#526174;
                        font-size:6px;
                      }

                      .core-icon {
                        width:34px;
                        height:34px;
                        display:flex;
                        justify-content:center;
                        align-items:center;
                        border-radius:10px;
                      }

                      .core-icon ha-icon {
                        --mdc-icon-size:19px;
                      }

                      .ems .core-icon {
                        color:#19d8ff;
                        background:rgba(25,216,255,.07);
                      }

                      .inverter .core-icon {
                        color:#facc15;
                        background:rgba(250,204,21,.07);
                      }

                      .core-data {
                        display:grid;
                        grid-template-columns:1fr 1fr;
                        gap:7px;
                        margin-top:13px;
                      }

                      .core-data div {
                        padding:9px;
                        border-radius:11px;
                        background:rgba(255,255,255,.018);
                      }

                      .core-data span {
                        display:block;
                        color:#526174;
                        font-size:6px;
                      }

                      .core-data strong {
                        display:block;
                        margin-top:4px;
                        font-size:9px;
                      }

                      .decision {
                        margin-top:10px;
                        padding-top:10px;
                        border-top:1px solid rgba(255,255,255,.045);
                      }

                      .decision span {
                        display:block;
                        color:#64748b;
                        font-size:6px;
                        font-weight:900;
                      }

                      .decision p {
                        margin:5px 0 0;
                        color:#cbd5e1;
                        font-size:8px;
                        line-height:1.45;
                      }


                      /* FONCTIONS */

                      .features {
                        display:grid;
                        grid-template-columns:
                          repeat(5,minmax(0,1fr));
                        gap:7px;
                      }

                      .feature {
                        padding:10px;
                        text-align:center;
                        border-radius:13px;
                        background:rgba(255,255,255,.018);
                        border:1px solid rgba(255,255,255,.045);
                      }

                      .feature span {
                        display:block;
                        color:#526174;
                        font-size:5px;
                        font-weight:900;
                      }

                      .feature strong {
                        display:block;
                        margin-top:5px;
                        font-size:8px;
                      }


                      /* BUS */

                      .bus {
                        display:grid;
                        grid-template-columns:1fr auto 1fr;
                        align-items:center;
                        gap:11px;
                        margin-top:10px;
                        padding:13px;
                        border-radius:15px;
                        background:
                          linear-gradient(
                            90deg,
                            rgba(25,216,255,.035),
                            rgba(250,204,21,.035)
                          );
                        border:1px solid rgba(255,255,255,.05);
                      }

                      .bus-core {
                        text-align:center;
                      }

                      .bus-core span {
                        display:block;
                        color:#526174;
                        font-size:6px;
                      }

                      .bus-core strong {
                        display:block;
                        margin-top:3px;
                        font-size:9px;
                      }

                      .bus-arrow {
                        color:#94a3b8;
                        font-size:18px;
                      }


                      /* FOOTER */

                      .footer {
                        display:flex;
                        justify-content:space-between;
                        gap:10px;
                        margin-top:12px;
                        padding-top:10px;
                        border-top:1px solid rgba(255,255,255,.04);
                        color:#526174;
                        font-size:6px;
                      }


                      @media(max-width:750px) {

                        .wrap {
                          padding:16px;
                        }

                        .header {
                          align-items:flex-start;
                          flex-direction:column;
                        }

                        .config-grid {
                          grid-template-columns:1fr;
                        }

                        .cores {
                          grid-template-columns:1fr;
                        }

                        .features {
                          grid-template-columns:
                            repeat(2,minmax(0,1fr));
                        }

                      }

                    </style>


                    <div class="wrap">


                      <div class="header">

                        <div class="brand">

                          <div class="logo">
                            <ha-icon icon="mdi:home-lightning-bolt"></ha-icon>
                          </div>

                          <div>

                            <div class="brand-small">
                              FOXCAT ENERGY V1.5.0
                            </div>

                            <div class="title">
                              Configuration EMS
                            </div>

                            <div class="subtitle">
                              Double cœur · stratégie · tarification
                            </div>

                          </div>

                        </div>


                        <div class="live">
                          ${
                            regulation.active
                              ? '● RÉGULATION ACTIVE'
                              : '○ RÉGULATION ARRÊTÉE'
                          }
                        </div>

                      </div>



                      <!-- CONFIGURATION PRINCIPALE -->

                      <div class="config-grid">


                        <div class="config">

                          <div class="config-label">
                            MODE DE CONSOMMATION / EMS
                          </div>

                          <div
                            class="config-value"
                            style="color:${modeColor};"
                          >
                            ${mode}
                          </div>

                          <div class="config-sub">
                            stratégie consommateurs
                          </div>

                        </div>



                        <div class="config">

                          <div class="config-label">
                            RÉGIME TARIFAIRE
                          </div>

                          <div
                            class="config-value"
                            style="color:${tariffColor};"
                          >
                            ${tariff}
                          </div>

                          <div class="config-sub">
                            période actuelle · ${tariffPeriod}
                          </div>

                        </div>



                        <div class="config">

                          <div class="config-label">
                            POLITIQUE RÉSEAU
                          </div>

                          <div
                            class="config-value"
                            style="color:${policyColor};"
                          >
                            ${policy}
                          </div>

                          <div class="config-sub">
                            stratégie EMS Onduleur
                          </div>

                        </div>


                      </div>



                      <!-- TARIFICATION -->

                      <div class="section-title">

                        TARIFICATION

                        <span>
                          FOXCAT PRICING
                        </span>

                      </div>


                      <div class="config-grid">


                        <div class="config">

                          <div class="config-label">
                            TARIF ACTUEL
                          </div>

                          <div
                            class="config-value"
                            style="color:${tariffColor};"
                          >
                            ${activePrice.toFixed(4)} €/kWh
                          </div>

                        </div>



                        <div class="config">

                          <div class="config-label">
                            PÉRIODE
                          </div>

                          <div class="config-value">
                            ${tariffPeriod}
                          </div>

                        </div>



                        <div class="config">

                          <div class="config-label">
                            STATUT PRIX
                          </div>

                          <div class="config-value">
                            ${priceStatus}
                          </div>

                        </div>


                      </div>



                      <!-- DOUBLE CORE -->

                      <div class="section-title">

                        DÉCISIONS DES DEUX CŒURS

                        <span>
                          EMS CORE ↔ ENERGYBUS ↔ ONDULEUR
                        </span>

                      </div>


                      <div class="cores">


                        <!-- CORE 1 -->

                        <div class="core ems">

                          <div class="core-head">

                            <div>

                              <div class="core-name">
                                EMS CORE
                              </div>

                              <div class="core-type">
                                CONSOMMATEURS / SÉCURITÉ
                              </div>

                            </div>

                            <div class="core-icon">
                              <ha-icon icon="mdi:brain"></ha-icon>
                            </div>

                          </div>


                          <div class="core-data">

                            <div>

                              <span>
                                PHASE
                              </span>

                              <strong>
                                ${phase}
                              </strong>

                            </div>


                            <div>

                              <span>
                                ACK
                              </span>

                              <strong>
                                ${coreAck}
                              </strong>

                            </div>


                            <div>

                              <span>
                                ACTION ATTENTE
                              </span>

                              <strong>
                                ${pending}
                              </strong>

                            </div>


                            <div>

                              <span>
                                DERNIÈRE ACTION
                              </span>

                              <strong>
                                ${lastAction}
                              </strong>

                            </div>

                          </div>


                          <div class="decision">

                            <span>
                              DÉCISION EMS CORE
                            </span>

                            <p>
                              ${coreDecision}
                            </p>

                          </div>

                        </div>



                        <!-- CORE 2 -->

                        <div class="core inverter">

                          <div class="core-head">

                            <div>

                              <div class="core-name">
                                EMS ONDULEUR
                              </div>

                              <div class="core-type">
                                PV / ONDULEUR / RRCR
                              </div>

                            </div>

                            <div class="core-icon">
                              <ha-icon icon="mdi:solar-power-variant"></ha-icon>
                            </div>

                          </div>


                          <div class="core-data">

                            <div>

                              <span>
                                ÉTAT
                              </span>

                              <strong>
                                ${inverterState}
                              </strong>

                            </div>


                            <div>

                              <span>
                                POTENTIEL PV
                              </span>

                              <strong>
                                ${inverterPotential}
                              </strong>

                            </div>


                            <div>

                              <span>
                                ONDULEUR ACTUEL
                              </span>

                              <strong>
                                ${Math.round(priCurrent)} %
                              </strong>

                            </div>


                            <div>

                              <span>
                                ONDULEUR CIBLE
                              </span>

                              <strong>
                                ${Math.round(priTarget)} %
                              </strong>

                            </div>

                          </div>


                          <div class="decision">

                            <span>
                              DÉCISION EMS ONDULEUR
                            </span>

                            <p>
                              ${inverterDecision}
                            </p>

                          </div>

                        </div>


                      </div>



                      <!-- ENERGY BUS -->

                      <div class="bus">

                        <div class="bus-core">

                          <span>
                            CORE 1
                          </span>

                          <strong style="color:#19d8ff;">
                            EMS
                          </strong>

                        </div>


                        <div class="bus-arrow">
                          ⇄
                        </div>


                        <div class="bus-core">

                          <span>
                            CORE 2
                          </span>

                          <strong style="color:#facc15;">
                            ONDULEUR
                          </strong>

                        </div>

                      </div>



                      <!-- FONCTIONS -->

                      <div class="section-title">

                        MODULES FOXCAT

                        <span>
                          ÉTAT CONFIGURATION
                        </span>

                      </div>


                      <div class="features">


                        <div class="feature">

                          <span>
                            PRI
                          </span>

                          <strong style="color:${priEnabled.color};">
                            ${priEnabled.text}
                          </strong>

                        </div>



                        <div class="feature">

                          <span>
                            BOILER
                          </span>

                          <strong style="color:${boilerEnabled.color};">
                            ${boilerEnabled.text}
                          </strong>

                        </div>



                        <div class="feature">

                          <span>
                            EMS 2
                          </span>

                          <strong style="color:${advisor.color};">
                            ${advisor.text}
                          </strong>

                        </div>



                        <div class="feature">

                          <span>
                            DÉLESTAGE
                          </span>

                          <strong style="color:${highLoad.color};">
                            ${highLoad.text}
                          </strong>

                        </div>



                        <div class="feature">

                          <span>
                            RÉGULATION
                          </span>

                          <strong style="color:${regulation.color};">
                            ${regulation.text}
                          </strong>

                        </div>


                      </div>



                      <div class="footer">

                        <span>
                          EMS CORE responsable des consommateurs
                        </span>

                        <span>
                          EMS Onduleur responsable PV / RRCR
                        </span>

                      </div>


                    </div>

                  `;
                ]]]
            tap_action:
              action: none
            hold_action:
              action: none
            double_tap_action:
              action: none
      - type: grid
        cards: []
      - type: grid
        columns: 2
        square: false
        cards:
          - type: custom:bubble-card
