                            deviceWord,
                            ...metricWords
                          ],
                          [],
                          rejected
                        );


                      if (
                        id
                      ) {
                        return id;
                      }
                    }


                    return null;
                  };


                  const legacyCandidate = (
                    ids = []
                  ) =>
                    ids.find(
                      (id) =>
                        states[id]
                    )
                    ||
                    null;


                  /* ==========================================================
                     CONSTRUCTION DES DONNÉES
                     ========================================================== */

