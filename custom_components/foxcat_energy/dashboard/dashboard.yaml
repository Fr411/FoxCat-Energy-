                          ${priceStatus}
                        </strong>

                      </div>

                    </div>

                  `;


                  /* ==========================================================
                     HTML DYNAMIQUE
                     ========================================================== */

                  const dynamicHtml = `

                    <div class="dynamic-main">


                      <div>

                        <div class="small-label">
