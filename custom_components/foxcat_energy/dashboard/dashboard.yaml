              - type: markdown
                title: Table Onduleur
                content: |
                  | Niveau | P.out max | RRCR |
                  |:------:|---------:|:----:|
                  | 100 % | 4000 W | 0000 |
                  | 90 % | 3600 W | 1001 
                  | 80 % | 3200 W | 1000 |
                  | 70 % | 2800 W | 0111 |
                  | 60 % | 2400 W | 0110 |
                  | 50 % | 2000 W | 0101 |
                  | 40 % | 1600 W | 0100 |
                  | 30 % | 1200 W | 0011 |
                  | 20 % | 800 W | 0010 |
                  | 10 % | 400 W | 0001 |
                  | 0 % | 0 W | 1010 |

