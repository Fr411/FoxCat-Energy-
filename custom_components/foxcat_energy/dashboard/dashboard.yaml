                square: false
                cards:
                  - type: button
                    name: 100 %
                    icon: mdi:solar-power
                    show_state: false
                    tap_action:
                      action: call-service
                      service: script.pri_rrcr_forcer_un_niveau
                      data:
                        niveau: 100
                  - type: button
                    name: 90 %
                    icon: mdi:solar-power
                    show_state: false
                    tap_action:
                      action: call-service
                      service: script.pri_rrcr_forcer_un_niveau
                      data:
                        niveau: 90
                  - type: button
                    name: 80 %
                    icon: mdi:solar-power
                    show_state: false
                    tap_action:
                      action: call-service
                      service: script.pri_rrcr_forcer_un_niveau
                      data:
                        niveau: 80
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: button
                    name: 70 %
                    icon: mdi:solar-power
                    tap_action:
                      action: call-service
                      service: script.pri_rrcr_forcer_un_niveau
                      data:
                        niveau: 70
                  - type: button
                    name: 60 %
                    icon: mdi:solar-power
                    tap_action:
                      action: call-service
                      service: script.pri_rrcr_forcer_un_niveau
                      data:
                        niveau: 60
                  - type: button
                    name: 50 %
                    icon: mdi:solar-power
                    tap_action:
                      action: call-service
                      service: script.pri_rrcr_forcer_un_niveau
                      data:
                        niveau: 50
              - type: grid
                columns: 3
                square: false
                cards:
                  - type: button
                    name: 40 %
                    icon: mdi:solar-power
                    tap_action:
                      action: call-service
                      service: script.pri_rrcr_forcer_un_niveau
                      data:
                        niveau: 40
                  - type: button
                    name: 30 %
                    icon: mdi:solar-power
                    tap_action:
                      action: call-service
                      service: script.pri_rrcr_forcer_un_niveau
                      data:
                        niveau: 30
                  - type: button
                    name: 20 %
                    icon: mdi:solar-power
                    tap_action:
                      action: call-service
                      service: script.pri_rrcr_forcer_un_niveau
                      data:
                        niveau: 20
              - type: grid
                columns: 3
                square: false
                cards:
