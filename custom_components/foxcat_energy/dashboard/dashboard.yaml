                  ## {{ niveau }} %
                  **Puissance onduleur maximale : {{ niveau * 40 }} W**
                  {% else %}
                  ## ⚠️ État onduleur inconnu
                  {% endif %}
                  Onduleur : **4000 W**
                  Mode EMS : **{{ states('[[foxcat:legacy.input_select_ems_mode]]') }}**
