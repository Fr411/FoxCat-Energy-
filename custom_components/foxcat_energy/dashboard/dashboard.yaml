            custom_fields:
              content: |
                [[[
                  const norm = (v) =>
                    String(v ?? '')
                      .normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '')
                      .toLowerCase()
                      .replace(/[^a-z0-9]+/g, ' ')
                      .trim();

                  const exists = (id) =>
                    !!(id && states[id]);

                  const findFox = (domain, words = [], candidates = []) => {

                    for (const id of candidates) {
                      if (exists(id)) return id;
                    }

                    const wanted =
                      words.map(norm).filter(Boolean);

                    const prefix =
                      `${domain}.`;

                    return (
                      Object.keys(states)
                        .filter(id => id.startsWith(prefix))
                        .find(id => {

                          const s =
                            states[id];

                          const friendly =
                            s?.attributes?.friendly_name || '';

                          const text =
                            norm(`${id} ${friendly}`);

                          const foxcat =
                            text.includes('foxcat energy') ||
                            norm(id).includes('foxcat energy');

                          return (
                            foxcat &&
                            wanted.every(word =>
                              text.includes(word)
                            )
                          );
                        })
                      || null
                    );
                  };

                  const stateOf = (id, fallback = '—') => {

                    if (!id || !states[id])
                      return fallback;

                    const v =
                      states[id].state;

                    if (
                      v === undefined ||
                      v === null ||
                      v === '' ||
                      v === 'unknown' ||
                      v === 'unavailable' ||
                      v === 'none'
                    )
                      return fallback;

                    return v;
                  };

                  const numberOf = (id, fallback = 0) => {

                    const v =
                      parseFloat(
                        stateOf(id, '')
                      );

                    return Number.isFinite(v)
                      ? v
                      : fallback;
                  };

                  const clamp = (v, min, max) =>
                    Math.min(
                      Math.max(Number(v) || 0, min),
                      max
                    );

                  const fmtPower = (value) => {

                    const v =
                      Math.abs(Number(value) || 0);

                    return v >= 1000
                      ? `${(v / 1000).toFixed(2)} kW`
                      : `${Math.round(v)} W`;
                  };


                  /* ============================================
                     ENTITÉS V1.5.0
                     ============================================ */

                  const E = {

                    pv:
                      findFox(
                        'sensor',
                        ['puissance', 'production', 'photovoltaique']
                      ),

                    export:
                      findFox(
                        'sensor',
                        ['puissance', 'reinjectee', 'reseau']
                      ),

                    import:
                      findFox(
                        'sensor',
                        ['puissance', 'prelevee', 'reseau']
                      ),

                    policy:
