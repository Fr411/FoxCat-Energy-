      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            triggers_update: all
            styles:
              card:
                - padding: 0
                - border-radius: 26px
                - overflow: hidden
                - background: >-
                    linear-gradient(145deg, rgba(7,11,20,0.98),
                    rgba(12,22,38,0.98))
                - border: 1px solid rgba(255,255,255,0.08)
                - box-shadow: 0 16px 38px rgba(0,0,0,0.35)
              grid:
                - grid-template-areas: '"content"'
                - grid-template-columns: 1fr
              custom_fields:
                content:
                  - width: 100%
            custom_fields:
              content: |
                [[[
                  /* ==========================================================
                     FOXCAT ENERGY V1.3.200
                     TARIFICATION PRINCIPALE + COÛT JOURNALIER

                     Régimes :
                     - Bi-horaire HP/HC
                     - Dynamique
                     - Compensation
                     ========================================================== */


                  /* ==========================================================
                     OUTILS
                     ========================================================== */

                  const norm = (value) =>
                    String(value ?? '')
                      .normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '')
                      .toLowerCase()
                      .replace(/[^a-z0-9]+/g, ' ')
                      .trim();


                  const exists = (id) =>
                    !!(id && states[id]);


                  const findFox = (
                    domain,
                    words = [],
                    candidates = []
                  ) => {

                    for (const id of candidates) {

                      if (exists(id)) {
                        return id;
                      }
                    }


                    const wanted =
                      words
                        .map(norm)
                        .filter(Boolean);


                    const prefix =
                      `${domain}.`;


                    const ids =
                      Object.keys(states)
                        .filter(
                          (id) =>
                            id.startsWith(prefix)
                        );


                    return (
                      ids.find(
                        (id) => {

                          const st =
                            states[id];


                          const friendly =
                            st?.attributes?.friendly_name || '';


                          const text =
                            norm(
                              `${id} ${friendly}`
                            );


                          const foxcat =
                            text.includes('foxcat energy')
                            ||
                            norm(id).includes('foxcat energy');


                          return (
                            foxcat
                            &&
                            wanted.every(
                              (word) =>
                                text.includes(word)
                            )
                          );
                        }
                      )
                      ||
                      null
                    );
                  };


                  const stateOf = (
                    id,
                    fallback = '—'
                  ) => {

                    if (
                      !id ||
                      !states[id]
                    ) {
                      return fallback;
                    }


                    const value =
                      states[id].state;


                    if (
                      value === undefined ||
                      value === null ||
                      value === '' ||
                      value === 'unknown' ||
                      value === 'unavailable' ||
                      value === 'none'
                    ) {
                      return fallback;
                    }


                    return value;
                  };


                  const numberOf = (
                    id,
                    fallback = null
                  ) => {

                    if (
                      !id ||
                      !states[id]
                    ) {
                      return fallback;
                    }


                    const raw =
                      states[id].state;


                    if (
                      raw === undefined ||
                      raw === null ||
                      raw === '' ||
                      raw === 'unknown' ||
                      raw === 'unavailable' ||
                      raw === 'none'
                    ) {
                      return fallback;
                    }


                    const value =
                      Number.parseFloat(raw);


                    return Number.isFinite(value)
                      ? value
                      : fallback;
                  };


                  const fmtPrice = (value) => {

                    if (!Number.isFinite(value)) {
                      return '—';
                    }

                    return `${value.toFixed(4)} €/kWh`;
                  };


                  const fmtRate = (value) => {

                    if (!Number.isFinite(value)) {
                      return '—';
                    }

                    return `${value.toFixed(3)} €/h`;
                  };


                  const fmtEuro = (value) => {

                    if (!Number.isFinite(value)) {
                      return '—';
                    }

                    return `${value.toFixed(2)} €`;
                  };


                  const fmtEnergy = (value) => {

                    if (!Number.isFinite(value)) {
                      return '—';
                    }

                    return `${Math.max(0, value).toFixed(2)} kWh`;
                  };


                  const fmtDelta = (value) => {

                    if (!Number.isFinite(value)) {
                      return '—';
                    }


                    const sign =
                      value > 0
                        ? '+'
                        : '';


                    return `${sign}${value.toFixed(4)} €/kWh`;
                  };


                  /* ==========================================================
                     ENTITÉS FOXCAT V1.3.200
                     ========================================================== */

                  const E = {

                    regimeSelect:
                      findFox(
                        'select',
                        [
                          'regime',
                          'tarifaire'
                        ],
                        [
                          '[[foxcat:pricing.regime]]'
                        ]
                      ),


                    regimeActive:
                      findFox(
                        'sensor',
                        [
                          'regime',
                          'tarifaire',
                          'actif'
                        ]
                      ),


                    period:
                      findFox(
                        'sensor',
                        [
                          'periode',
                          'tarifaire'
                        ]
                      ),


                    priceStatus:
                      findFox(
                        'sensor',
                        [
                          'statut',
                          'prix'
                        ]
                      ),


                    costModel:
                      findFox(
                        'sensor',
                        [
                          'modele',
                          'cout'
                        ]
                      ),


                    activeBuy:
                      findFox(
                        'sensor',
                        [
                          'prix',
                          'achat',
                          'actif'
                        ]
                      ),


                    exportValue:
                      findFox(
                        'sensor',
                        [
                          'valeur',
                          'economique',
                          'reinjection'
                        ]
                      ),


                    hpPrice:
                      findFox(
                        'sensor',
                        [
                          'prix',
                          'heures',
                          'pleines'
                        ]
                      ),


                    hcPrice:
                      findFox(
                        'sensor',
                        [
                          'prix',
                          'heures',
                          'creuses'
                        ]
                      ),


                    fixedInjection:
                      findFox(
                        'sensor',
                        [
                          'prix',
                          'fixe',
                          'reinjection'
                        ]
                      ),


                    hpSource:
                      findFox(
                        'sensor',
                        [
                          'source',
                          'prix',
                          'heures',
                          'pleines'
                        ]
                      ),


                    hcSource:
                      findFox(
                        'sensor',
                        [
                          'source',
                          'prix',
                          'heures',
                          'creuses'
                        ]
                      ),


                    dynamicCurrent:
                      findFox(
                        'sensor',
                        [
                          'prix',
                          'dynamique',
                          'actuel'
                        ]
                      ),


                    dynamicNext:
                      findFox(
                        'sensor',
                        [
                          'prix',
                          'dynamique',
                          'heure',
                          'suivante'
                        ]
                      ),


                    dynamicInjection:
                      findFox(
                        'sensor',
                        [
                          'prix',
                          'dynamique',
                          'reinjection',
                          'brut'
                        ]
                      ),


                    negativePrice:
                      findFox(
                        'sensor',
                        [
                          'prix',
                          'dynamique',
                          'negatif',
                          'actif'
                        ]
                      ),


                    importRate:
                      findFox(
                        'sensor',
                        [
                          'cout',
                          'instantane',
                          'prelevement'
                        ]
                      ),


                    exportRate:
                      findFox(
                        'sensor',
                        [
                          'valeur',
                          'instantanee',
                          'reinjection'
                        ]
                      ),


                    netRate:
                      findFox(
                        'sensor',
                        [
                          'solde',
                          'financier',
                          'instantane',
                          'reseau'
                        ]
                      )

                  };


                  /* ==========================================================
                     RÉGIME TARIFAIRE
                     ========================================================== */

                  const selectedRegime =
                    stateOf(
                      E.regimeSelect,
                      stateOf(
                        E.regimeActive,
                        'Compensation'
                      )
                    );


                  const activeRegime =
                    stateOf(
                      E.regimeActive,
                      selectedRegime
                    );


                  const period =
                    stateOf(
                      E.period,
                      '—'
                    );


                  const priceStatus =
                    stateOf(
                      E.priceStatus,
                      '—'
                    );


                  const costModel =
                    stateOf(
                      E.costModel,
                      '—'
                    );


                  const normalizedRegime =
                    norm(selectedRegime);


                  const isDynamic =
                    normalizedRegime.includes(
                      'dynamique'
                    );


                  const isTou =
                    normalizedRegime.includes(
                      'bi horaire'
                    )
                    ||
                    normalizedRegime.includes(
                      'hp hc'
                    );


                  const isCompensation =
                    !isDynamic &&
                    !isTou;


                  /* ==========================================================
                     PRIX FOXCAT
                     ========================================================== */

                  const hpPrice =
                    numberOf(
                      E.hpPrice
                    );


                  const hcPrice =
                    numberOf(
                      E.hcPrice
                    );


                  const fixedInjection =
                    numberOf(
                      E.fixedInjection
                    );


                  const dynamicCurrent =
                    numberOf(
                      E.dynamicCurrent
                    );


                  const dynamicNext =
                    numberOf(
                      E.dynamicNext
                    );


                  const dynamicInjectionRaw =
                    numberOf(
                      E.dynamicInjection
                    );


                  /*
                   * Valeur économique NORMALISÉE FoxCat.
                   *
                   * Important :
                   * le capteur brut Luminus d'injection peut être signé.
                   * FoxCat normalise déjà cette valeur.
                   */

                  const exportEconomicValue =
                    numberOf(
                      E.exportValue
                    );


                  let activeBuy =
                    numberOf(
                      E.activeBuy
                    );


                  if (
                    !Number.isFinite(activeBuy)
                  ) {

                    if (
                      isDynamic
                    ) {

                      activeBuy =
                        dynamicCurrent;
                    }


                    else if (
                      isTou ||
                      isCompensation
                    ) {

                      activeBuy =
                        period === 'HP'
                          ? hpPrice
                          : hcPrice;
                    }

                  }


                  const hpSource =
                    stateOf(
                      E.hpSource,
                      '—'
                    );


                  const hcSource =
                    stateOf(
                      E.hcSource,
                      '—'
                    );


                  const negativePrice =
                    stateOf(
                      E.negativePrice,
                      'NON'
                    );


                  /* ==========================================================
                     COÛTS INSTANTANÉS FOXCAT
                     ========================================================== */

                  const importRate =
                    numberOf(
                      E.importRate
                    );


                  const exportRate =
                    numberOf(
                      E.exportRate
                    );


                  const netRate =
                    numberOf(
                      E.netRate
                    );


                  /* ==========================================================
                     COMPTEURS JOURNALIERS
                     ========================================================== */

                  /*
                   * Consommation totale réelle maison.
                   */

                  const houseDay =
                    Math.max(
                      numberOf(
                        '[[foxcat:legacy.sensor_homefoxcat_total_consumption_today]]',
                        0
                      ),
                      0
                    );


                  /*
                   * Production photovoltaïque totale.
                   */

                  const pvDay =
                    Math.max(
                      numberOf(
                        '[[foxcat:legacy.sensor_homefoxcat_total_production_today]]',
                        0
                      ),
                      0
                    );


                  /*
                   * Prélèvement réseau depuis minuit.
                   */

                  const importDay =
                    Math.max(
                      numberOf(
                        '[[foxcat:legacy.sensor_consommation_jour]]',
                        0
                      ),
                      0
                    );


                  /*
                   * Réinjection réseau depuis minuit.
                   */

                  const exportDay =
                    Math.max(
                      numberOf(
                        '[[foxcat:legacy.sensor_reinjection_jour]]',
                        0
                      ),
                      0
                    );


                  /*
                   * PV réellement utilisé directement dans la maison.
                   */

                  const selfConsumed =
                    Math.max(
                      pvDay -
                      exportDay,
                      0
                    );


                  /* ==========================================================
                     BILAN FINANCIER JOURNALIER
                     ========================================================== */

                  const buyPriceForDaily =
                    Number.isFinite(activeBuy)
                      ? activeBuy
                      : 0;


                  /*
                   * COÛT BRUT
                   *
                   * prélèvement réseau × prix actif
                   */

                  const grossDailyCost =
                    importDay *
                    buyPriceForDaily;


                  /*
                   * VALEUR RÉINJECTION
                   */

                  let exportDailyValue =
                    0;


                  let compensatedEnergy =
                    0;


                  if (
                    isCompensation
                  ) {

                    /*
                     * En compensation :
                     *
                     * la réinjection vient compenser
                     * énergétiquement le prélèvement.
                     */

                    compensatedEnergy =
                      Math.min(
                        importDay,
                        exportDay
                      );


                    exportDailyValue =
                      compensatedEnergy *
                      buyPriceForDaily;
                  }


                  else {

                    const exportPrice =
                      Number.isFinite(
                        exportEconomicValue
                      )
                        ? exportEconomicValue
                        : (
                            Number.isFinite(
                              fixedInjection
                            )
                              ? fixedInjection
                              : 0
                          );


                    exportDailyValue =
                      exportDay *
                      exportPrice;
                  }


                  /*
                   * COÛT NET
                   */

                  let dailyNetCost =
                    0;


                  if (
                    isCompensation
                  ) {

                    const netGridEnergy =
                      Math.max(
                        importDay -
                        exportDay,
                        0
                      );


                    dailyNetCost =
                      netGridEnergy *
                      buyPriceForDaily;
                  }


                  else {

                    dailyNetCost =
                      grossDailyCost -
                      exportDailyValue;
                  }


                  /*
                   * Valeur du solaire autoconsommé.
                   */

                  const solarDailySaving =
                    selfConsumed *
                    buyPriceForDaily;


                  /*
                   * Coût théorique sans photovoltaïque.
                   */

                  const theoreticalWithoutPv =
                    houseDay *
                    buyPriceForDaily;


                  /*
                   * Avantage photovoltaïque global.
                   */

                  const photovoltaicBenefit =
                    theoreticalWithoutPv -
                    Math.max(
                      dailyNetCost,
                      0
                    );


                  /*
                   * Solde énergétique réseau.
                   */

                  const netGridDay =
                    importDay -
                    exportDay;


                  /* ==========================================================
                     INDICATION PRÉCISION JOURNALIÈRE
                     ========================================================== */

                  let dailyMethod =
                    'ESTIMATION';


                  let dailyNote =
                    'Calcul journalier basé sur le prix actuellement actif.';


                  if (
                    isDynamic
                  ) {

                    dailyMethod =
                      'ESTIMATION DYNAMIQUE';


                    dailyNote =
                      'Le coût journalier est actuellement estimé avec le prix dynamique actif. Un compteur FoxCat accumulé heure par heure sera nécessaire pour obtenir le coût dynamique exact.';
                  }


                  else if (
                    isTou
                  ) {

                    dailyMethod =
                      'ESTIMATION HP / HC';


                    dailyNote =
                      `Calcul basé sur le tarif ${period} actuellement actif. Pour un coût journalier exact, les kWh HP et HC doivent être accumulés séparément.`;
                  }


                  else {

                    dailyMethod =
                      'ESTIMATION COMPENSATION';


                    dailyNote =
                      'Sous compensation, le coût du jour est une représentation indicative du solde énergétique. La compensation réelle s’apprécie sur la période de facturation.';
                  }


                  /* ==========================================================
                     STYLE DU RÉGIME
                     ========================================================== */

                  let primaryColor =
                    '#21d7ff';


                  let regimeIcon =
                    'mdi:cash-sync';


                  let regimeShort =
                    selectedRegime;


                  if (
                    isDynamic
                  ) {

                    primaryColor =
                      '#a78bfa';

                    regimeIcon =
                      'mdi:chart-line';

                    regimeShort =
                      'DYNAMIQUE';
                  }


                  else if (
                    isTou
                  ) {

                    primaryColor =
                      period === 'HP'
                        ? '#ff922b'
                        : '#19d8ff';

                    regimeIcon =
                      'mdi:clock-outline';

                    regimeShort =
                      'HP / HC';
                  }


                  else {

                    primaryColor =
                      '#35e59d';

                    regimeIcon =
                      'mdi:swap-horizontal';

                    regimeShort =
                      'COMPENSATION';
                  }


                  /* ==========================================================
                     STATUT PRIX
                     ========================================================== */

                  let statusColor =
                    '#facc15';


                  const statusNorm =
                    norm(
                      priceStatus
                    );


                  if (
                    statusNorm.includes(
                      'avantage'
                    )
                    ||
                    statusNorm.includes(
                      'bas'
                    )
                    ||
                    statusNorm.includes(
                      'negatif'
                    )
                  ) {

                    statusColor =
                      '#35e59d';
                  }


                  else if (
                    statusNorm.includes(
                      'eleve'
                    )
                    ||
                    statusNorm.includes(
                      'cher'
                    )
                  ) {

                    statusColor =
                      '#fb7185';
                  }


                  /* ==========================================================
                     TENDANCE DYNAMIQUE
                     ========================================================== */

                  let dynamicTrend =
                    'STABLE';


                  let dynamicTrendIcon =
                    '→';


                  let dynamicTrendColor =
                    '#94a3b8';


                  let dynamicDelta =
                    null;


                  if (
                    Number.isFinite(
                      dynamicCurrent
                    )
                    &&
                    Number.isFinite(
                      dynamicNext
                    )
                  ) {

                    dynamicDelta =
                      dynamicNext -
                      dynamicCurrent;


                    if (
                      dynamicDelta > 0.01
                    ) {

                      dynamicTrend =
                        'HAUSSE';

                      dynamicTrendIcon =
                        '↗';

                      dynamicTrendColor =
                        '#fb7185';
                    }


                    else if (
                      dynamicDelta < -0.01
                    ) {

                      dynamicTrend =
                        'BAISSE';

                      dynamicTrendIcon =
                        '↘';

                      dynamicTrendColor =
                        '#35e59d';
                    }

                  }


                  /* ==========================================================
                     ANALYSE
                     ========================================================== */

                  let analysisIcon =
                    'mdi:information-outline';


                  let analysisTitle =
                    'Tarification active';


                  let analysisText =
                    '';


                  let analysisColor =
                    primaryColor;


                  if (
                    isDynamic
                  ) {

                    analysisIcon =
                      'mdi:chart-line';


                    if (
                      negativePrice === 'OUI'
                    ) {

                      analysisTitle =
                        'Prix négatif actif';


                      analysisColor =
                        '#35e59d';


                      analysisText =
                        `Le prix d'achat est actuellement négatif : ${fmtPrice(dynamicCurrent)}.`;
                    }


                    else if (
                      dynamicTrend === 'HAUSSE'
                    ) {

                      analysisTitle =
                        'Hausse prévue';


                      analysisColor =
                        '#fb7185';


                      analysisText =
                        `${fmtPrice(dynamicCurrent)} actuellement → ${fmtPrice(dynamicNext)} à l'heure suivante.`;
                    }


                    else if (
                      dynamicTrend === 'BAISSE'
                    ) {

                      analysisTitle =
                        'Baisse prévue';


                      analysisColor =
                        '#35e59d';


                      analysisText =
                        `${fmtPrice(dynamicCurrent)} actuellement → ${fmtPrice(dynamicNext)} à l'heure suivante.`;
                    }


                    else {

                      analysisTitle =
                        'Prix relativement stable';


                      analysisText =
                        'Le prix actuel et le prix de l’heure suivante sont proches.';
                    }

                  }


                  else if (
                    isTou
                  ) {

                    analysisIcon =
                      period === 'HP'
                        ? 'mdi:weather-sunny-alert'
                        : 'mdi:weather-night';


                    analysisTitle =
                      period === 'HP'
                        ? 'Heures pleines actives'
                        : 'Heures creuses actives';


                    analysisColor =
                      period === 'HP'
                        ? '#ff922b'
                        : '#19d8ff';


                    analysisText =
                      period === 'HP'
                        ? `FoxCat applique actuellement le tarif HP : ${fmtPrice(activeBuy)}.`
                        : `FoxCat applique actuellement le tarif HC : ${fmtPrice(activeBuy)}.`;

                  }


                  else {

                    analysisIcon =
                      'mdi:swap-horizontal-bold';


                    analysisTitle =
                      'Régime compensation';


                    analysisColor =
                      '#35e59d';


                    analysisText =
                      'FoxCat utilise actuellement le modèle de compensation pour le bilan réseau.';
                  }


                  /* ==========================================================
                     HTML HP / HC
                     ========================================================== */

                  const touHtml = `

                    <div class="tariff-grid">


