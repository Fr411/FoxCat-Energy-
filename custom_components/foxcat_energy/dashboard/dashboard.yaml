    subview: true
    cards: []
  - type: sections
    max_columns: 4
    icon: mdi:flash
    path: energie
    sections:
      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            grid_options:
              columns: full
            custom_fields:
              panel: |
                [[[
                  /* =========================================================
                     FOXCAT ENERGY V1.3.200
                     ONGLET ÉNERGIE
                     ========================================================= */

                  /* =========================
                     OUTILS
                     ========================= */

                  const norm = (value) =>
                    String(value ?? '')
                      .normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '')
                      .toLowerCase()
                      .replace(/[^a-z0-9]+/g, ' ')
                      .trim();

                  const exists = (id) =>
                    !!(id && states[id]);

                  const findFox = (
                    domain,
                    words = [],
                    candidates = []
                  ) => {

                    for (const id of candidates) {
                      if (exists(id)) {
                        return id;
                      }
                    }

                    const wanted =
                      words
                        .map(norm)
                        .filter(Boolean);

                    const prefix =
                      `${domain}.`;

                    const ids =
                      Object
                        .keys(states)
                        .filter(
                          (id) =>
                            id.startsWith(prefix)
                        );

                    return (
                      ids.find(
                        (id) => {

                          const st =
                            states[id];

                          const friendly =
                            st?.attributes?.friendly_name || '';

                          const haystack =
                            norm(
                              `${id} ${friendly}`
                            );

                          const foxcat =
                            haystack.includes(
                              'foxcat energy'
                            )
                            ||
                            norm(id).includes(
                              'foxcat energy'
                            );

                          return (
                            foxcat
                            &&
                            wanted.every(
                              (word) =>
                                haystack.includes(word)
                            )
                          );
                        }
                      )
                      ||
                      null
                    );
                  };


                  const stateOf = (
                    id,
                    fallback = '—'
                  ) => {

                    if (
                      !id ||
                      !states[id]
                    ) {
                      return fallback;
                    }

                    const value =
                      states[id].state;

                    if (
                      value === undefined ||
                      value === null ||
                      value === '' ||
                      value === 'unknown' ||
                      value === 'unavailable' ||
                      value === 'none'
                    ) {
                      return fallback;
                    }

                    return value;
                  };


                  const numberOf = (
                    id,
                    fallback = 0
                  ) => {

                    const value =
                      Number.parseFloat(
                        stateOf(
                          id,
                          ''
                        )
                      );

                    return Number.isFinite(value)
                      ? value
                      : fallback;
                  };


                  const isOn = (id) =>
                    id &&
                    states[id]?.state === 'on';


                  const clamp = (
                    value,
                    min,
                    max
                  ) =>
                    Math.min(
                      Math.max(
                        Number(value) || 0,
                        min
                      ),
                      max
                    );


                  const fmtPower = (value) => {

                    const v =
                      Math.abs(
                        Number(value) || 0
                      );

                    if (v >= 1000) {

                      return (
                        `${(v / 1000).toFixed(2)} kW`
                      );
                    }

                    return (
                      `${Math.round(v)} W`
                    );
                  };


                  const fmtEnergy = (value) => {

                    const v =
                      Number(value);

                    if (
                      !Number.isFinite(v)
                    ) {
                      return '—';
                    }

                    return (
                      `${v.toFixed(2)} kWh`
                    );
                  };


                  const fmtPercent = (value) =>
                    `${clamp(value, 0, 100).toFixed(0)} %`;


                  const fmtEuro = (value) =>
                    `${Number(value || 0).toFixed(2)} €`;


                  /* =========================================================
                     ENTITÉS FOXCAT V1.3.200
                     ========================================================= */

                  const E = {

                    mode:
                      findFox(
                        'select',
                        [
                          'mode',
                          'ems'
                        ],
                        [
                          '[[foxcat:ems.mode]]'
                        ]
                      ),


                    pv:
                      findFox(
                        'sensor',
                        [
                          'production',
                          'photovoltaique'
                        ],
                        [
                          '[[foxcat:energy.pv_power]]'
                        ]
                      ),


                    house:
                      findFox(
                        'sensor',
                        [
                          'consommation',
                          'maison'
                        ],
                        [
                          '[[foxcat:energy.house_power]]'
                        ]
                      ),


                    export:
                      findFox(
                        'sensor',
                        [
                          'reinjection',
                          'reseau'
                        ],
                        [
                          '[[foxcat:energy.grid_export]]'
                        ]
                      ),


                    import:
                      findFox(
                        'sensor',
                        [
                          'prelevement',
                          'reseau'
                        ],
                        [
                          '[[foxcat:energy.grid_import]]'
                        ]
                      ),


                    balance:
                      findFox(
                        'sensor',
                        [
                          'balance',
                          'reseau'
                        ],
                        [
                          '[[foxcat:energy.grid_power]]'
                        ]
                      ),


                    priLevel:
                      findFox(
                        'sensor',
                        [
                          'niveau',
                          'pri',
                          'actuel'
                        ]
                      ),


                    priTarget:
                      findFox(
                        'sensor',
                        [
                          'niveau',
                          'pri',
                          'cible'
                        ]
                      ),


                    priDirection:
                      findFox(
                        'sensor',
                        [
                          'direction',
                          'pri'
                        ]
                      ),


                    priAckGrid:
                      findFox(
                        'sensor',
                        [
                          'ack',
                          'reseau',
                          'pri'
                        ]
                      ),


                    priReason:
                      findFox(
                        'sensor',
                        [
                          'derniere',
                          'decision',
                          'pri'
                        ]
                      ),


                    boilerTemp:
                      findFox(
                        'sensor',
                        [
                          'temperature',
                          'boiler'
                        ]
                      ),


                    boilerPower:
                      findFox(
                        'sensor',
                        [
                          'puissance',
                          'boiler'
                        ]
                      ),


                    boilerDemand:
                      findFox(
                        'sensor',
                        [
                          'demande',
                          'boiler'
                        ]
                      ),


                    boilerOrigin:
                      findFox(
                        'sensor',
                        [
                          'origine',
                          'boiler'
                        ]
                      ),


                    boilerPhysical:
                      findFox(
                        'binary_sensor',
                        [
                          'boiler',
                          'physique'
                        ]
                      ),


                    solarConfidence:
                      findFox(
                        'sensor',
                        [
                          'confiance',
                          'solaire'
                        ]
                      ),


                    solarPotential:
                      findFox(
                        'sensor',
                        [
                          'potentiel',
                          'solaire'
                        ]
                      ),


                    solarTrend:
                      findFox(
                        'sensor',
                        [
                          'tendance',
                          'solaire'
                        ]
                      ),


                    currentPrice:
                      findFox(
                        'sensor',
                        [
                          'prix',
                          'dynamique',
                          'actuel'
                        ]
                      ),


                    nextPrice:
                      findFox(
                        'sensor',
                        [
                          'prix',
                          'dynamique',
                          'heure',
                          'suivante'
                        ]
                      )
                  };


                  /* =========================================================
                     PUISSANCES INSTANTANÉES
                     ========================================================= */

                  const pvPower =
                    Math.max(
                      numberOf(
                        E.pv,
                        numberOf(
                          '[[foxcat:sources.pv]]',
                          0
                        )
                      ),
                      0
                    );


                  const housePower =
                    Math.max(
                      numberOf(
                        E.house,
                        numberOf(
                          '[[foxcat:legacy.sensor_consommation_reelle_maison]]',
                          0
                        )
                      ),
                      0
                    );


                  const importPower =
                    Math.max(
                      numberOf(
                        E.import,
                        numberOf(
                          '[[foxcat:sources.grid_signed]]',
                          0
                        )
                      ),
                      0
                    );


                  const exportPower =
                    Math.max(
                      numberOf(
                        E.export,
                        numberOf(
                          '[[foxcat:sources.grid_fallback]]',
                          0
                        )
                      ),
                      0
                    );


                  const gridBalance =
                    E.balance
                      ? numberOf(
                          E.balance,
                          exportPower -
                          importPower
                        )
                      : exportPower -
                        importPower;


                  const solarCoverage =
                    housePower > 0
                      ? clamp(
                          (
                            pvPower /
                            housePower
                          ) * 100,
                          0,
                          100
                        )
                      : pvPower > 0
                        ? 100
                        : 0;


                  /* =========================================================
                     COMPTEURS JOUR
                     ========================================================= */

                  const consumptionDay =
                    Math.max(
                      numberOf(
                        '[[foxcat:legacy.sensor_consommation_jour]]',
                        0
                      ),
                      0
                    );


                  const exportDay =
                    Math.max(
                      numberOf(
                        '[[foxcat:legacy.sensor_reinjection_jour]]',
                        0
                      ),
                      0
                    );


                  const pvDay =
                    Math.max(
                      numberOf(
                        '[[foxcat:legacy.sensor_homefoxcat_total_production_today]]',
                        0
                      ),
                      0
                    );


                  const solarSelfConsumed =
                    Math.max(
                      pvDay -
                      exportDay,
                      0
                    );


                  const gridDay =
                    Math.max(
                      consumptionDay -
                      solarSelfConsumed,
                      0
                    );


                  const selfConsumptionRate =
                    pvDay > 0
                      ? clamp(
                          (
                            solarSelfConsumed /
                            pvDay
                          ) * 100,
                          0,
                          100
                        )
                      : 0;


                  const autonomyRate =
                    consumptionDay > 0
                      ? clamp(
                          (
                            solarSelfConsumed /
                            consumptionDay
                          ) * 100,
                          0,
                          100
                        )
                      : 0;


                  /* =========================================================
                     PRIX
                     ========================================================= */

                  const currentPrice =
                    Math.max(
                      numberOf(
                        E.currentPrice,
                        numberOf(
                          '[[foxcat:pricing.source.current]]',
                          0
                        )
                      ),
                      0
                    );


                  const nextPrice =
                    Math.max(
                      numberOf(
                        E.nextPrice,
                        numberOf(
                          '[[foxcat:legacy.sensor_luminus_luminus]]',
                          currentPrice
                        )
                      ),
                      0
                    );


                  const estimatedCost =
                    gridDay *
                    currentPrice;


                  const solarSaving =
                    solarSelfConsumed *
                    currentPrice;


                  let priceState =
                    'NORMAL';

                  let priceColor =
                    '#facc15';


                  if (
                    currentPrice < 0.20
                  ) {

                    priceState =
                      'AVANTAGEUX';

                    priceColor =
                      '#34d399';
                  }

                  else if (
                    currentPrice > 0.35
                  ) {

                    priceState =
                      'ÉLEVÉ';

                    priceColor =
                      '#fb7185';
                  }


                  const priceDelta =
                    nextPrice -
                    currentPrice;


                  let nextTrend =
                    '→ stable';

                  let nextTrendColor =
                    '#94a3b8';


                  if (
                    priceDelta > 0.01
                  ) {

                    nextTrend =
                      '↗ hausse';

                    nextTrendColor =
                      '#fb7185';
                  }

                  else if (
                    priceDelta < -0.01
                  ) {

                    nextTrend =
                      '↘ baisse';

                    nextTrendColor =
                      '#34d399';
                  }


                  /* =========================================================
                     ÉTAT RÉSEAU
                     ========================================================= */

                  let gridState =
                    'ÉQUILIBRE';

                  let gridPower =
                    0;

                  let gridClass =
                    'neutral';

                  let gridIcon =
                    'mdi:transmission-tower';

                  let gridArrow =
                    '↔';


                  if (
                    exportPower > 30 &&
                    exportPower >= importPower
                  ) {

                    gridState =
                      'RÉINJECTION';

                    gridPower =
                      exportPower;

                    gridClass =
                      'export';

                    gridIcon =
                      'mdi:transmission-tower-export';

                    gridArrow =
                      '↑';
                  }

                  else if (
                    importPower > 30
                  ) {

                    gridState =
                      'PRÉLÈVEMENT';

                    gridPower =
                      importPower;

                    gridClass =
                      'import';

                    gridIcon =
                      'mdi:transmission-tower-import';

                    gridArrow =
                      '↓';
                  }


                  /* =========================================================
                     PRI
                     ========================================================= */

                  const priLevel =
                    clamp(
                      numberOf(
                        E.priLevel,
                        100
                      ),
                      0,
                      100
                    );


                  const priTarget =
                    clamp(
                      numberOf(
                        E.priTarget,
                        priLevel
                      ),
                      0,
                      100
                    );


                  const priDirection =
                    stateOf(
                      E.priDirection,
                      'maintien'
                    );


                  const priAckGrid =
                    stateOf(
                      E.priAckGrid,
                      '—'
                    );


                  const priReason =
                    stateOf(
                      E.priReason,
                      'Aucune décision PRI disponible'
                    );


                  /* =========================================================
                     BOILER
                     ========================================================= */

                  const boilerTemp =
                    numberOf(
                      E.boilerTemp,
                      numberOf(
                        '[[foxcat:boiler.temperature_source]]',
                        0
                      )
                    );


                  const boilerPower =
                    Math.max(
                      numberOf(
                        E.boilerPower,
                        numberOf(
                          '[[foxcat:boiler.power_source]]',
                          0
                        )
                      ),
                      0
                    );


                  const boilerRunning =
                    E.boilerPhysical
                      ? isOn(
                          E.boilerPhysical
                        )
                      : boilerPower > 200;


                  const boilerDemand =
                    stateOf(
                      E.boilerDemand,
                      'AUCUNE'
                    );


                  const boilerOrigin =
                    stateOf(
                      E.boilerOrigin,
                      'AUCUNE'
                    );


                  /* =========================================================
                     EMS
                     ========================================================= */

                  const mode =
                    stateOf(
                      E.mode,
                      'Inconnu'
                    );


                  const solarConfidence =
                    clamp(
                      numberOf(
                        E.solarConfidence,
                        0
                      ),
                      0,
                      100
                    );


                  const solarPotential =
                    stateOf(
                      E.solarPotential,
                      '—'
                    );


                  const solarTrend =
                    stateOf(
                      E.solarTrend,
                      '—'
                    );


                  const modeMap = {

                    'Économie énergie':
                      [
                        '🌿',
                        '#34d399'
                      ],

                    'Economie énergie':
                      [
                        '🌿',
                        '#34d399'
                      ],

                    'Zéro injection':
                      [
                        '⛔',
                        '#fb7185'
                      ],

                    'ECS solaire':
                      [
                        '♨️',
                        '#fb923c'
                      ],

                    'Prix dynamique':
                      [
                        '📈',
                        '#a78bfa'
                      ],

                    'Confort':
                      [
                        '🏠',
                        '#38bdf8'
                      ],

                    'Manuel':
                      [
                        '🖐️',
                        '#60a5fa'
                      ]
                  };


                  const [
                    modeIcon,
                    modeColor
                  ] =
                    modeMap[mode]
                    ||
                    [
                      '⚡',
                      '#c4b5fd'
                    ];


                  /* =========================================================
                     SYNTHÈSE
                     ========================================================= */

                  let summary =
                    'Équilibre énergétique stable.';

                  let summaryColor =
                    '#60a5fa';

                  let summaryIcon =
                    'mdi:chart-line';


                  if (
                    exportPower > 150
                  ) {

                    summary =
                      `Surplus solaire : ${fmtPower(exportPower)} sont actuellement réinjectés.`;

                    summaryColor =
                      '#34d399';

                    summaryIcon =
                      'mdi:solar-power-variant';
                  }

                  else if (
                    importPower > 500
                  ) {

                    summary =
                      `La maison prélève actuellement ${fmtPower(importPower)} sur le réseau.`;

                    summaryColor =
                      '#fb7185';

                    summaryIcon =
                      'mdi:transmission-tower-import';
                  }

                  else if (
                    pvPower > 50 &&
                    solarCoverage >= 95
                  ) {

                    summary =
                      'Le solaire couvre pratiquement toute la consommation actuelle.';

                    summaryColor =
                      '#facc15';

                    summaryIcon =
                      'mdi:white-balance-sunny';
                  }

                  else if (
                    pvPower > 50
                  ) {

                    summary =
                      `Le photovoltaïque couvre actuellement ${fmtPercent(solarCoverage)} des besoins de la maison.`;

                    summaryColor =
                      '#22d3ee';

                    summaryIcon =
                      'mdi:solar-power';
                  }


                  /* =========================================================
                     RENDU
                     ========================================================= */

                  return `

                    <div class="energy-card">


                      <!-- HEADER -->

                      <div class="header">

                        <div class="brand">

                          <div class="brand-icon">
                            <ha-icon icon="mdi:lightning-bolt"></ha-icon>
                          </div>

                          <div>

                            <div class="brand-name">
                              HOME<span class="fox">FOX</span><span class="cat">CAT</span>
                              <span class="energy-name">ENERGY</span>
                            </div>

                            <div class="brand-subtitle">
                              ENERGY MANAGEMENT SYSTEM
                            </div>

                          </div>

                        </div>


                        <div
                          class="mode-pill"
                          style="
                            color:${modeColor};
                            border-color:${modeColor}35;
                            background:${modeColor}10;
                          "
                        >
                          ${modeIcon}
                          ${mode}
                        </div>

                      </div>



                      <!-- FLUX PRINCIPAL -->

                      <div class="flow-card">

                        <div class="flow-title-row">

                          <div>

                            <div class="section-kicker">
                              FLUX ÉNERGÉTIQUE
                            </div>

                            <div class="flow-summary">
                              situation instantanée de l'installation
                            </div>

                          </div>

                          <div class="live">
                            <span class="live-dot"></span>
                            TEMPS RÉEL
                          </div>

                        </div>


                        <div class="flow-grid">


                          <!-- PV -->

                          <div class="flow-node solar-node">

                            <div class="flow-icon">
                              <ha-icon icon="mdi:solar-power"></ha-icon>
                            </div>

                            <div class="flow-label">
                              SOLAIRE
                            </div>

                            <div class="flow-value">
                              ${fmtPower(pvPower)}
                            </div>

                          </div>


                          <div class="flow-arrow">
                            →
                          </div>


                          <!-- MAISON -->

                          <div class="flow-node house-node">

                            <div class="flow-icon">
                              <ha-icon icon="mdi:home-lightning-bolt"></ha-icon>
                            </div>

                            <div class="flow-label">
                              MAISON
                            </div>

                            <div class="flow-value">
                              ${fmtPower(housePower)}
                            </div>

                          </div>


                          <div class="flow-arrow">
                            ↔
                          </div>


                          <!-- RÉSEAU -->

                          <div class="flow-node grid-node ${gridClass}">

                            <div class="flow-icon">
                              <ha-icon icon="${gridIcon}"></ha-icon>
                            </div>

                            <div class="flow-label">
                              RÉSEAU
                            </div>

                            <div class="flow-value">
                              ${fmtPower(gridPower)}
                            </div>

                          </div>

                        </div>


                        <div class="network-line ${gridClass}">

                          <div>

                            <span>
                              ÉCHANGE RÉSEAU
                            </span>

                            <strong>
                              ${gridState}
                            </strong>

                          </div>

                          <div class="network-balance">
                            ${gridArrow}
                            ${fmtPower(gridPower)}
                          </div>

                        </div>

                      </div>



                      <!-- AUJOURD'HUI -->

                      <div class="section-title">

                        <span>
                          AUJOURD'HUI
                        </span>

                        <small>
                          BILAN ÉNERGÉTIQUE
                        </small>

                      </div>


                      <div class="kpi-grid">


                        <div class="kpi solar">

                          <div class="kpi-icon">
                            <ha-icon icon="mdi:white-balance-sunny"></ha-icon>
                          </div>

                          <div class="kpi-label">
                            PRODUCTION PV
                          </div>

                          <div class="kpi-value">
                            ${fmtEnergy(pvDay)}
                          </div>

                          <div class="kpi-foot">
                            énergie produite aujourd'hui
                          </div>

                        </div>



                        <div class="kpi consumption">

                          <div class="kpi-icon">
                            <ha-icon icon="mdi:home-lightning-bolt-outline"></ha-icon>
                          </div>

                          <div class="kpi-label">
                            CONSOMMATION
                          </div>

                          <div class="kpi-value">
                            ${fmtEnergy(consumptionDay)}
                          </div>

                          <div class="kpi-foot">
                            énergie consommée par la maison
                          </div>

                        </div>



                        <div class="kpi self">

                          <div class="kpi-icon">
                            <ha-icon icon="mdi:home-battery-outline"></ha-icon>
                          </div>

                          <div class="kpi-label">
                            AUTOCONSOMMÉ
                          </div>

                          <div class="kpi-value">
                            ${fmtEnergy(solarSelfConsumed)}
                          </div>

                          <div class="kpi-foot">
                            solaire utilisé directement
                          </div>

                        </div>



                        <div class="kpi export">

                          <div class="kpi-icon">
                            <ha-icon icon="mdi:transmission-tower-export"></ha-icon>
                          </div>

                          <div class="kpi-label">
                            RÉINJECTION
                          </div>

                          <div class="kpi-value">
                            ${fmtEnergy(exportDay)}
                          </div>

                          <div class="kpi-foot">
                            énergie envoyée vers le réseau
                          </div>

                        </div>


                      </div>



                      <!-- PERFORMANCE + COÛT -->

                      <div class="double-grid">


                        <div class="panel">

                          <div class="panel-title">
                            PERFORMANCE SOLAIRE
                          </div>


                          <div class="metric-row">

                            <div>

                              <span>
                                Couverture actuelle
                              </span>

                              <strong>
                                ${fmtPercent(solarCoverage)}
                              </strong>

                            </div>

                            <div class="bar">

                              <div
                                class="bar-fill cyan"
                                style="
                                  width:${solarCoverage}%;
                                "
                              ></div>

                            </div>

                          </div>


                          <div class="metric-row">

                            <div>

                              <span>
                                Autoconsommation
                              </span>

                              <strong>
                                ${fmtPercent(selfConsumptionRate)}
                              </strong>

                            </div>

                            <div class="bar">

                              <div
                                class="bar-fill orange"
                                style="
                                  width:${selfConsumptionRate}%;
                                "
                              ></div>

                            </div>

                          </div>


                          <div class="metric-row">

                            <div>

                              <span>
                                Autonomie solaire
                              </span>

                              <strong>
                                ${fmtPercent(autonomyRate)}
                              </strong>

                            </div>

                            <div class="bar">

                              <div
                                class="bar-fill green"
                                style="
                                  width:${autonomyRate}%;
                                "
                              ></div>

                            </div>

                          </div>

                        </div>



                        <!-- COÛT -->

                        <div class="panel cost-panel">

                          <div class="panel-title">
                            COÛT ÉNERGIE
                          </div>


                          <div class="cost-hero">

                            <div class="cost-value">
                              ${fmtEuro(estimatedCost)}
                            </div>

                            <div class="cost-caption">
                              coût réseau estimé aujourd'hui
                            </div>

                          </div>


                          <div class="row">

                            <span>
                              Réseau estimé
                            </span>

                            <strong>
                              ${fmtEnergy(gridDay)}
                            </strong>

                          </div>


                          <div class="row">

                            <span>
                              Prix actuel
                            </span>

                            <strong>
                              ${currentPrice.toFixed(3)} €/kWh
                            </strong>

                          </div>


                          <div class="row">

                            <span>
                              Heure suivante
                            </span>

                            <strong
                              style="
                                color:${nextTrendColor};
                              "
                            >
                              ${nextPrice.toFixed(3)} €
                              ${nextTrend}
                            </strong>

                          </div>


                          <div class="row saving-row">

                            <span>
                              Économie solaire
                            </span>

                            <strong>
                              ${fmtEuro(solarSaving)}
                            </strong>

                          </div>


                          <div
                            class="price-badge"
                            style="
                              color:${priceColor};
                              background:${priceColor}0d;
                              border-color:${priceColor}30;
                            "
                          >
                            ${priceState}
                          </div>

                        </div>

                      </div>



                      <!-- FOXCAT -->

                      <div class="section-title">

                        <span>
                          FOXCAT ENERGY
                        </span>

                        <small>
                          EMS · PRI · ECS
                        </small>

                      </div>


                      <div class="foxcat-grid">


                        <!-- PRI -->

                        <div class="mini pri">

                          <div class="mini-top">

                            <span>
                              ONDULEUR SOLAREDGE
                            </span>

                            <ha-icon icon="mdi:solar-power-variant"></ha-icon>

                          </div>


                          <div class="mini-main">
                            ${Math.round(priLevel)} %
                          </div>


                          <div class="mini-sub">

                            Cible
                            <strong>
                              ${Math.round(priTarget)} %
                            </strong>

                            ·

                            ${priDirection}

                          </div>


                          <div class="mini-bar">

                            <div
                              style="
                                width:${priLevel}%;
                              "
                            ></div>

                          </div>


                          <div class="mini-foot">

                            ACK réseau :
                            ${priAckGrid}

                          </div>

                        </div>



                        <!-- BOILER -->

                        <div class="mini boiler">

                          <div class="mini-top">

                            <span>
                              BOILER
                            </span>

                            <ha-icon icon="mdi:water-boiler"></ha-icon>

                          </div>


                          <div class="mini-main">
                            ${boilerTemp.toFixed(1)} °C
                          </div>


                          <div class="mini-sub">

                            ${
                              boilerRunning
                                ? '● Chauffe'
                                : '○ Attente'
                            }

                            ·

                            ${fmtPower(boilerPower)}

                          </div>


                          <div class="mini-foot">

                            Demande :
                            ${boilerDemand}

                            <br>

                            Origine :
                            ${boilerOrigin}

                          </div>

                        </div>



                        <!-- EMS2 -->

                        <div class="mini forecast">

                          <div class="mini-top">

                            <span>
                              EMS 2 SOLAIRE
                            </span>

                            <ha-icon icon="mdi:weather-sunny-alert"></ha-icon>

                          </div>


                          <div class="mini-main">
                            ${Math.round(solarConfidence)} %
                          </div>


                          <div class="mini-sub">

                            Potentiel :
                            ${solarPotential}

                          </div>


                          <div class="mini-bar forecast-bar">

                            <div
                              style="
                                width:${solarConfidence}%;
                              "
                            ></div>

                          </div>


                          <div class="mini-foot">

                            Tendance :
                            ${solarTrend}

                          </div>

                        </div>


                      </div>



                      <!-- SYNTHÈSE -->

                      <div
                        class="summary"
                        style="
                          border-color:${summaryColor}25;
                          background:${summaryColor}0d;
                        "
                      >

                        <div
                          class="summary-icon"
                          style="
                            color:${summaryColor};
                            background:${summaryColor}10;
                          "
                        >

                          <ha-icon icon="${summaryIcon}"></ha-icon>

                        </div>


                        <div>

                          <div class="summary-label">
                            ANALYSE ÉNERGÉTIQUE
                          </div>

                          <div class="summary-value">
                            ${summary}
                          </div>

                        </div>

                      </div>



                      <!-- FOOTER -->

                      <div class="footer">

                        <span>
                          FOXCAT ENERGY V1.3.200
                        </span>

                        <span>
                          Production · Consommation · Optimisation
                        </span>

                      </div>


                    </div>

                  `;
                ]]]
            styles:
              card:
                - padding: 0
                - overflow: hidden
                - border-radius: 28px
                - border: 1px solid rgba(148,163,184,.12)
                - background: |
                    radial-gradient(
                      circle at 0% 0%,
                      rgba(255,132,28,.10),
                      transparent 26%
                    ),
                    radial-gradient(
                      circle at 100% 0%,
                      rgba(22,211,255,.08),
                      transparent 28%
                    ),
                    linear-gradient(
                      145deg,
                      #070b14 0%,
                      #0b1421 52%,
                      #07101b 100%
                    )
                - box-shadow: |
                    inset 0 1px 0 rgba(255,255,255,.045),
                    0 18px 45px rgba(0,0,0,.28)
              grid:
                - grid-template-areas: '"panel"'
                - grid-template-columns: 1fr
              custom_fields:
                panel:
                  - width: 100%
            extra_styles: |

              * {
                box-sizing: border-box;
              }


              .energy-card {

                width: 100%;

                padding: 24px;

                color: #f8fafc;

                font-family:
                  -apple-system,
                  BlinkMacSystemFont,
                  "Segoe UI",
                  Roboto,
                  sans-serif;
              }


              /* =========================================================
                 HEADER
                 ========================================================= */

              .header {

                display: flex;

                align-items: center;

                justify-content: space-between;

                gap: 16px;

                margin-bottom: 18px;
              }


              .brand {

                display: flex;

                align-items: center;

                gap: 14px;
              }


              .brand-icon {

                width: 50px;

                height: 50px;

                flex: none;

                display: flex;

                align-items: center;

                justify-content: center;

                border-radius: 15px;

                background:
                  linear-gradient(
                    135deg,
                    rgba(255,138,38,.15),
                    rgba(25,216,255,.13)
                  );

                border:
                  1px solid rgba(255,255,255,.09);
              }


              .brand-icon ha-icon {

                --mdc-icon-size: 28px;

                color: #f8fafc;

                filter:
                  drop-shadow(
                    -3px 0 7px rgba(255,138,38,.4)
                  )
                  drop-shadow(
                    3px 0 7px rgba(25,216,255,.4)
                  );
              }


              .brand-name {

                font-size: 21px;

                line-height: 1;

                font-weight: 900;

                letter-spacing: .045em;

                white-space: nowrap;
              }


              .fox {
                color: #ff8a26;
              }


              .cat {
                color: #19d8ff;
              }


              .energy-name {

                margin-left: 7px;

                color: #94a3b8;

                font-weight: 600;
              }


              .brand-subtitle {

                margin-top: 7px;

                color: #64748b;

                font-size: 8px;

                font-weight: 700;

                letter-spacing: .23em;
              }


              .mode-pill {

                padding: 8px 11px;

                border-radius: 14px;

                border: 1px solid;

                font-size: 9px;

                font-weight: 900;

                white-space: nowrap;
              }


              /* =========================================================
                 FLUX
                 ========================================================= */

              .flow-card {

                padding: 18px;

                border-radius: 22px;

                background:
                  rgba(255,255,255,.026);

                border:
                  1px solid rgba(255,255,255,.055);
              }


              .flow-title-row {

                display: flex;

                justify-content: space-between;

                align-items: center;

                gap: 12px;
              }


              .section-kicker {

                color: #94a3b8;

                font-size: 8px;

                font-weight: 900;

                letter-spacing: .16em;
              }


              .flow-summary {

                margin-top: 4px;

                color: #526174;

                font-size: 8px;
              }


              .live {

                display: flex;

                align-items: center;

                gap: 7px;

                padding: 7px 10px;

                border-radius: 18px;

                color: #34d399;

                background:
                  rgba(52,211,153,.06);

                border:
                  1px solid rgba(52,211,153,.13);

                font-size: 8px;

                font-weight: 900;
              }


              .live-dot {

                width: 7px;

                height: 7px;

                border-radius: 50%;

                background:
                  #34d399;

                box-shadow:
                  0 0 8px rgba(52,211,153,.85);
              }


              .flow-grid {

                display: grid;

                grid-template-columns:
                  1fr
                  28px
                  1fr
                  28px
                  1fr;

                align-items: center;

                gap: 4px;

                margin-top: 18px;
              }


              .flow-node {

                min-width: 0;

                padding: 16px 10px;

                border-radius: 17px;

                text-align: center;

                background:
                  rgba(255,255,255,.018);
              }


              .flow-icon {

                height: 30px;

                display: flex;

                align-items: center;

                justify-content: center;
              }


              .flow-icon ha-icon {
                --mdc-icon-size: 26px;
              }


              .flow-label {

                margin-top: 7px;

                color: #64748b;

                font-size: 8px;

                font-weight: 800;

                letter-spacing: .08em;
              }


              .flow-value {

                margin-top: 4px;

                font-size: 21px;

                font-weight: 900;

                white-space: nowrap;
              }


              .solar-node .flow-icon,
              .solar-node .flow-value {
                color: #ff982f;
              }


              .house-node .flow-icon,
              .house-node .flow-value {
                color: #21d7ff;
              }


              .grid-node.export .flow-icon,
              .grid-node.export .flow-value {
                color: #34d399;
              }


              .grid-node.import .flow-icon,
              .grid-node.import .flow-value {
                color: #fb7185;
              }


              .flow-arrow {

                color: #334155;

                text-align: center;

                font-size: 18px;
              }


              .network-line {

                display: flex;

                align-items: center;

                justify-content: space-between;

                gap: 12px;

                margin-top: 12px;

                padding: 10px 12px;

                border-radius: 13px;

                background:
                  rgba(255,255,255,.02);

                border:
                  1px solid rgba(255,255,255,.04);
              }


              .network-line span {

                display: block;

                color: #64748b;

                font-size: 7px;

                font-weight: 800;

                letter-spacing: .12em;
              }


              .network-line strong {

                display: block;

                margin-top: 2px;

                color: #cbd5e1;

                font-size: 10px;
              }


              .network-line.export strong,
              .network-line.export .network-balance {
                color: #34d399;
              }


              .network-line.import strong,
              .network-line.import .network-balance {
                color: #fb7185;
              }


              .network-balance {

                color: #94a3b8;

                font-size: 11px;

                font-weight: 900;
              }


              /* =========================================================
                 TITRES
                 ========================================================= */

              .section-title {

                display: flex;

                justify-content: space-between;

                align-items: center;

                gap: 10px;

                margin:
                  22px 1px 10px;
              }


              .section-title span {

                color: #718096;

                font-size: 8px;

                font-weight: 900;

                letter-spacing: .17em;
              }


              .section-title small {

                color: #475569;

                font-size: 7px;

                font-weight: 800;

                letter-spacing: .08em;
              }


              /* =========================================================
                 KPI JOUR
                 ========================================================= */

              .kpi-grid {

                display: grid;

                grid-template-columns:
                  repeat(
                    4,
                    minmax(0,1fr)
                  );

                gap: 10px;
              }


              .kpi {

                min-width: 0;

                padding: 15px;

                border-radius: 17px;

                background:
                  rgba(255,255,255,.022);

                border:
                  1px solid rgba(255,255,255,.05);
              }


              .kpi-icon {

                width: 34px;

                height: 34px;

                display: flex;

                align-items: center;

                justify-content: center;

                border-radius: 10px;

                background:
                  rgba(255,255,255,.035);
              }


              .kpi-icon ha-icon {
                --mdc-icon-size: 19px;
              }


              .kpi-label {

                margin-top: 12px;

                color: #64748b;

                font-size: 7px;

                font-weight: 800;

                letter-spacing: .07em;
              }


              .kpi-value {

                margin-top: 4px;

                color: #f1f5f9;

                font-size: 18px;

                font-weight: 900;

                white-space: nowrap;
              }


              .kpi-foot {

                margin-top: 4px;

                color: #526174;

                font-size: 7px;

                line-height: 1.35;
              }


              .solar .kpi-icon,
              .solar .kpi-value {
                color: #ff982f;
              }


              .consumption .kpi-icon,
              .consumption .kpi-value {
                color: #21d7ff;
              }


              .self .kpi-icon,
              .self .kpi-value {
                color: #facc15;
              }


              .export .kpi-icon,
              .export .kpi-value {
                color: #34d399;
              }


              /* =========================================================
                 PANNEAUX
                 ========================================================= */

              .double-grid {

                display: grid;

                grid-template-columns:
                  1fr 1fr;

                gap: 10px;

                margin-top: 14px;
              }


              .panel {

                padding: 16px;

                border-radius: 18px;

                background:
                  rgba(255,255,255,.025);

                border:
                  1px solid rgba(255,255,255,.05);
              }


              .panel-title {

                color: #718096;

                font-size: 8px;

                font-weight: 900;

                letter-spacing: .12em;
              }


              .metric-row {
                margin-top: 13px;
              }


              .metric-row > div:first-child {

                display: flex;

                align-items: center;

                justify-content: space-between;

                gap: 10px;
              }


              .metric-row span {

                color: #64748b;

                font-size: 9px;
              }


              .metric-row strong {

                color: #f8fafc;

                font-size: 11px;
              }


              .bar {

                height: 6px;

                margin-top: 7px;

                overflow: hidden;

                border-radius: 20px;

                background:
                  rgba(255,255,255,.055);
              }


              .bar-fill {

                height: 100%;

                border-radius: 20px;
              }


              .bar-fill.cyan {
                background: #21d7ff;
              }


              .bar-fill.orange {
                background: #ff982f;
              }


              .bar-fill.green {
                background: #34d399;
              }


              /* =========================================================
                 COÛT
                 ========================================================= */

              .cost-panel {

                position: relative;

                background:
                  radial-gradient(
                    circle at 100% 0%,
                    rgba(52,211,153,.075),
                    transparent 50%
                  ),
                  rgba(255,255,255,.025);
              }


              .cost-hero {

                margin:
                  12px 0 11px;

                text-align: center;
              }


              .cost-value {

                color: #34d399;

                font-size: 31px;

                line-height: 1;

                font-weight: 950;
              }


              .cost-caption {

                margin-top: 4px;

                color: #64748b;

                font-size: 8px;
              }


              .row {

                display: flex;

                align-items: center;

                justify-content: space-between;

                gap: 10px;

                margin-top: 8px;

                padding-top: 8px;

                border-top:
                  1px solid rgba(255,255,255,.04);

                color: #64748b;

                font-size: 9px;
              }


              .row strong {

                color: #e2e8f0;

                text-align: right;

                font-size: 9px;
              }


              .saving-row strong {
                color: #34d399;
              }


              .price-badge {

                margin-top: 10px;

                padding: 7px 9px;

                border-radius: 11px;

                border: 1px solid;

                text-align: center;

                font-size: 8px;

                font-weight: 900;

                letter-spacing: .11em;
              }


              /* =========================================================
                 FOXCAT
                 ========================================================= */

              .foxcat-grid {

                display: grid;

                grid-template-columns:
                  repeat(
                    3,
                    minmax(0,1fr)
                  );

                gap: 10px;
              }


              .mini {

                min-width: 0;

                padding: 15px;

                border-radius: 17px;

                background:
                  rgba(255,255,255,.022);

                border:
                  1px solid rgba(255,255,255,.05);
              }


              .mini-top {

                display: flex;

                align-items: center;

                justify-content: space-between;

                gap: 8px;

                color: #718096;

                font-size: 7px;

                font-weight: 900;

                letter-spacing: .09em;
              }


              .mini-top ha-icon {
                --mdc-icon-size: 18px;
              }


              .pri .mini-top ha-icon {
                color: #facc15;
              }


              .boiler .mini-top ha-icon {
                color: #fb923c;
              }


              .forecast .mini-top ha-icon {
                color: #21d7ff;
              }


              .mini-main {

                margin-top: 9px;

                color: #f8fafc;

                font-size: 25px;

                font-weight: 950;
              }


              .mini-sub {

                margin-top: 3px;

                color: #64748b;

                font-size: 8px;

                line-height: 1.35;
              }


              .mini-bar {

                height: 5px;

                margin-top: 10px;

                overflow: hidden;

                border-radius: 20px;

                background:
                  rgba(255,255,255,.055);
              }


              .mini-bar > div {

                height: 100%;

                border-radius: 20px;

                background:
                  #facc15;
              }


              .forecast-bar > div {
                background: #21d7ff;
              }


              .mini-foot {

                margin-top: 8px;

                color: #526174;

                font-size: 7px;

                line-height: 1.4;
              }


              /* =========================================================
                 SYNTHÈSE
                 ========================================================= */

              .summary {

                display: flex;

                align-items: center;

                gap: 12px;

                margin-top: 14px;

                padding: 14px 15px;

                border-radius: 16px;

                border: 1px solid;
              }


              .summary-icon {

                flex: none;

                width: 38px;

                height: 38px;

                display: flex;

                align-items: center;

                justify-content: center;

                border-radius: 11px;
              }


              .summary-icon ha-icon {
                --mdc-icon-size: 21px;
              }


              .summary-label {

                color: #718096;

                font-size: 7px;

                font-weight: 900;

                letter-spacing: .12em;
              }


              .summary-value {

                margin-top: 4px;

                color: #cbd5e1;

                font-size: 9px;

                line-height: 1.45;
              }


              /* =========================================================
                 FOOTER
                 ========================================================= */

              .footer {

                display: flex;

                justify-content: space-between;

                gap: 10px;

                margin-top: 16px;

                padding-top: 11px;

                border-top:
                  1px solid rgba(255,255,255,.04);

                color: #475569;

                font-size: 7px;

                letter-spacing: .08em;
              }


              /* =========================================================
                 RESPONSIVE TABLETTE / MOBILE
                 ========================================================= */

              @media (max-width: 900px) {

                .kpi-grid {

                  grid-template-columns:
                    repeat(
                      2,
                      minmax(0,1fr)
                    );
                }

              }


              @media (max-width: 700px) {

                .energy-card {
                  padding: 17px;
                }


                .header {

                  align-items: flex-start;

                  flex-direction: column;
                }


                .brand-name {
                  font-size: 17px;
                }


                .flow-grid {

                  grid-template-columns:
                    1fr
                    16px
                    1fr
                    16px
                    1fr;
                }


                .flow-value {
                  font-size: 15px;
                }


                .flow-node {
                  padding: 13px 5px;
                }


                .double-grid,
                .foxcat-grid {

                  grid-template-columns:
                    1fr;
                }


                .footer {
                  flex-direction: column;
                }

              }
            tap_action:
              action: none
            hold_action:
              action: none
            double_tap_action:
              action: none
