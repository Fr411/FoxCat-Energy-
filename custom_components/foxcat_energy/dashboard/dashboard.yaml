              - type: markdown
                title: ⚡ Onduleur SolarEdge
                content: |
                  {% set code =
                    ('1' if is_state('[[foxcat:inverter.rrcr_l4]]','on') else '0')
                    ~
                    ('1' if is_state('[[foxcat:inverter.rrcr_l3]]','on') else '0')
