                  /* ==========================================================
                     FOXCAT ENERGY V1.5.0
                     CONSOMMATION APPAREILS — COMPTABILITÉ NATIVE FOXCAT

                     Priorité : entités natives FoxCat Energy V1.5.0
                     Fallback : anciens capteurs uniquement si nécessaire.
                     Une carte n'est affichée que si sa gestion FoxCat est active.
                     ========================================================== */


                  /* ==========================================================
                     OUTILS
                     ========================================================== */

                  const norm = (value) =>
                    String(value ?? '')
                      .normalize('NFD')
                      .replace(/[\u0300-\u036f]/g, '')
                      .toLowerCase()
                      .replace(/[^a-z0-9]+/g, ' ')
                      .trim();


                  const validState = (id) => {

                    const s =
                      id
                        ? states[id]
                        : null;

                    return (
                      !!s &&
                      ![
                        'unknown',
                        'unavailable',
                        'none',
                        ''
                      ].includes(
                        String(s.state)
                      )
                    );
                  };


                  const stateOf = (
                    id,
                    fallback = '—'
                  ) =>
                    validState(id)
                      ? states[id].state
                      : fallback;


                  const numberOf = (
                    id,
                    fallback = 0
                  ) => {

                    if (!validState(id)) {
                      return fallback;
                    }

                    const v =
                      Number.parseFloat(
                        states[id].state
                      );

                    return Number.isFinite(v)
                      ? v
                      : fallback;
                  };


                  const isOn = (id) =>
                    !!id &&
                    states[id]?.state === 'on';


                  const clamp = (
                    v,
                    min,
                    max
                  ) =>
                    Math.min(
                      Math.max(
                        Number(v) || 0,
                        min
                      ),
                      max
                    );


                  const fmtEnergy = (v) =>
