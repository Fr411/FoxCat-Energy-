kiosk_mode:
  hide_header: '{{ is_state("[[foxcat:legacy.input_boolean_ems_head_menu]]", "on") }}'
  hide_sidebar: '{{ is_state("[[foxcat:legacy.input_boolean_ems_head_lateral]]", "on") }}'
views:
  - type: sections
    max_columns: 4
    title: Accueil
    path: Emsdash
    icon: mdi:home
    show_icon_and_title: false
    sections:
      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_icon: false
            show_state: false
            custom_fields:
              header: |
                [[[
                  return `
                    <div class="hfc-header">

                      <div class="hfc-logo">
                        <div class="fox-glow"></div>
                        <ha-icon icon="mdi:cat"></ha-icon>
                      </div>

                      <div class="hfc-name">

                        <div class="hfc-title">
                          <span class="home"></span><span class="fox">FOX</span><span class="cat">CAT</span>
                          <span class="energy">ENERGY</span>
                        </div>

                        <div class="hfc-subtitle">
                          ENERGY MANAGEMENT SYSTEM
                        </div>

                      </div>

                      <div class="hfc-line">
                        <span class="line-orange"></span>
                        <span class="line-blue"></span>
                      </div>

                    </div>
                  `;
                ]]]
            styles:
              card:
                - padding: 17px 22px
                - border-radius: 20px
                - overflow: hidden
                - background: |
                    radial-gradient(
                      circle at 3% 50%,
                      rgba(255,120,20,0.15),
                      transparent 24%
                    ), radial-gradient(
                      circle at 95% 30%,
                      rgba(0,210,255,0.11),
                      transparent 28%
                    ), linear-gradient(
                      135deg,
                      #080d16 0%,
                      #0a1420 48%,
                      #071827 100%
                    )
                - border: 1px solid rgba(255,255,255,0.08)
                - box-shadow: >
                    0 10px 30px rgba(0,0,0,0.30), inset 0 1px 0
                    rgba(255,255,255,0.035)
              grid:
                - grid-template-areas: '"header"'
                - grid-template-columns: 1fr
                - grid-template-rows: auto
              custom_fields:
                header:
                  - width: 100%
            extra_styles: |

              .hfc-header {
                position: relative;

                width: 100%;

                display: flex;
                align-items: center;

                gap: 16px;

                box-sizing: border-box;
              }


              /* ==========================================
                 LOGO
                 ========================================== */

              .hfc-logo {
                position: relative;

                width: 54px;
                height: 54px;

                flex: 0 0 54px;

                display: flex;
                align-items: center;
                justify-content: center;

                border-radius: 16px;

                background:
                  linear-gradient(
                    135deg,
                    rgba(255,126,25,0.15),
                    rgba(0,211,255,0.12)
                  );

                border: 1px solid rgba(255,255,255,0.10);

                box-shadow:
                  -5px 0 20px rgba(255,110,15,0.12),
                  5px 0 20px rgba(0,210,255,0.12);
              }


              .hfc-logo::before {
                content: "";

                position: absolute;

                inset: 3px;

                border-radius: 13px;

                border-top:
                  1px solid rgba(255,137,37,0.45);

                border-right:
                  1px solid rgba(0,216,255,0.40);
              }


              .hfc-logo ha-icon {
                position: relative;

                color: #ffffff;

                --mdc-icon-size: 31px;

                filter:
                  drop-shadow(-3px 0 5px rgba(255,110,20,0.55))
                  drop-shadow(3px 0 5px rgba(0,210,255,0.50));
              }


              /* ==========================================
                 NOM
                 ========================================== */

              .hfc-name {
                display: flex;
                flex-direction: column;

                justify-content: center;
              }


              .hfc-title {
                white-space: nowrap;

                font-size: 24px;
                font-weight: 850;

                line-height: 1;

                letter-spacing: 0.055em;
              }


              .hfc-title .home {
                color: #ffffff;
              }


              /* RENARD */

              .hfc-title .fox {
                color: #ff8a26;

                text-shadow:
                  0 0 12px rgba(255,120,20,0.25);
              }


              /* CHAT */

              .hfc-title .cat {
                color: #19d8ff;

                text-shadow:
                  0 0 12px rgba(0,210,255,0.25);
              }


              /* ENERGY */

              .hfc-title .energy {
                margin-left: 9px;

                color: #a9bdcc;

                font-weight: 600;
              }


              /* ==========================================
                 SOUS-TITRE
                 ========================================== */

              .hfc-subtitle {
                margin-top: 7px;

                color: #71899d;

                font-size: 8px;
                font-weight: 600;

                letter-spacing: 0.28em;
              }


              /* ==========================================
                 LIGNE SIGNATURE
                 ========================================== */

              .hfc-line {
                height: 2px;

                flex: 1;

                min-width: 60px;

                margin-left: 12px;

                display: flex;

                border-radius: 10px;

                overflow: hidden;

                opacity: 0.75;
              }


              .line-orange {
                width: 38%;

                background:
                  linear-gradient(
                    90deg,
                    rgba(255,130,25,0),
                    #ff8125
                  );

                box-shadow:
                  0 0 10px rgba(255,120,20,0.40);
              }


              .line-blue {
                flex: 1;

                background:
                  linear-gradient(
                    90deg,
                    #00d8ff,
                    rgba(0,216,255,0)
                  );

                box-shadow:
                  0 0 10px rgba(0,216,255,0.40);
              }
          - type: custom:bubble-card
            card_type: select
            entity: [[foxcat:ems.mode]]
            name: Mode EMS
            icon: mdi:lightning-bolt-circle
            sub_button:
              main: []
              bottom: []
            force_icon: false
            show_state: true
            show_last_changed: false
            show_last_updated: false
            show_attribute: false
            card_layout: large
            theme: ios-dark-mode-dark-blue
            rows: '1'
            styles: |
              .bubble-button-card-container {
                position: relative;
                min-height: 78px !important;
                border-radius: 22px !important;
                overflow: hidden;

                background:
                  linear-gradient(
                    145deg,
                    rgba(14, 20, 31, 0.96),
                    rgba(8, 13, 22, 0.98)
                  ) !important;

                border: 1px solid rgba(255,255,255,0.07) !important;

                box-shadow:
                  0 14px 36px rgba(0,0,0,0.30),
                  inset 0 1px 0 rgba(255,255,255,0.035) !important;

                backdrop-filter: blur(18px);
              }

              /* Barre d'accent verticale */
              .bubble-button-card-container::before {
                content: "";
                position: absolute;
                left: 0;
                top: 14px;
                bottom: 14px;
                width: 4px;
                border-radius: 0 8px 8px 0;

                background:
                  ${state === 'Économie énergie'
                    ? '#22d3ee'
                  : state === 'Réinjection autorisée'
                    ? '#38bdf8'
                  : state === 'Réinjection refusée'
                    ? '#fb7185'
                  : state === 'ECS solaire'
                    ? '#fbbf24'
                  : state === 'Tarification dynamique'
                    ? '#c084fc'
                  : state === 'Confort'
                    ? '#f472b6'
                  : '#64748b'};
              }

              /* Halo discret */
              .bubble-button-card-container::after {
                content: "";
                position: absolute;
                left: 0;
                top: 0;
                width: 120px;
                height: 100%;
                pointer-events: none;

                background:
                  ${state === 'Économie énergie'
                    ? 'linear-gradient(90deg, rgba(34,211,238,0.08), transparent)'
                  : state === 'Réinjection autorisée'
                    ? 'linear-gradient(90deg, rgba(56,189,248,0.08), transparent)'
                  : state === 'Réinjection refusée'
                    ? 'linear-gradient(90deg, rgba(251,113,133,0.08), transparent)'
                  : state === 'ECS solaire'
                    ? 'linear-gradient(90deg, rgba(251,191,36,0.08), transparent)'
                  : state === 'Tarification dynamique'
                    ? 'linear-gradient(90deg, rgba(192,132,252,0.08), transparent)'
                  : state === 'Confort'
                    ? 'linear-gradient(90deg, rgba(244,114,182,0.08), transparent)'
                  : 'transparent'};
              }

              .bubble-icon-container {
                width: 48px !important;
                height: 48px !important;
                margin-left: 6px !important;
                border-radius: 15px !important;

                background:
                  ${state === 'Économie énergie'
                    ? 'rgba(34,211,238,0.10)'
                  : state === 'Réinjection autorisée'
                    ? 'rgba(56,189,248,0.10)'
                  : state === 'Réinjection refusée'
                    ? 'rgba(251,113,133,0.10)'
                  : state === 'ECS solaire'
                    ? 'rgba(251,191,36,0.10)'
                  : state === 'Tarification dynamique'
                    ? 'rgba(192,132,252,0.10)'
                  : state === 'Confort'
                    ? 'rgba(244,114,182,0.10)'
                  : 'rgba(255,255,255,0.05)'} !important;

                border:
                  1px solid
                  ${state === 'Économie énergie'
                    ? 'rgba(34,211,238,0.16)'
                  : state === 'Réinjection autorisée'
                    ? 'rgba(56,189,248,0.16)'
                  : state === 'Réinjection refusée'
                    ? 'rgba(251,113,133,0.16)'
                  : state === 'ECS solaire'
                    ? 'rgba(251,191,36,0.16)'
                  : state === 'Tarification dynamique'
                    ? 'rgba(192,132,252,0.16)'
                  : state === 'Confort'
                    ? 'rgba(244,114,182,0.16)'
                  : 'rgba(255,255,255,0.06)'} !important;
              }

              .bubble-icon {
                color:
                  ${state === 'Économie énergie'
                    ? '#22d3ee'
                  : state === 'Réinjection autorisée'
                    ? '#38bdf8'
                  : state === 'Réinjection refusée'
                    ? '#fb7185'
                  : state === 'ECS solaire'
                    ? '#fbbf24'
                  : state === 'Tarification dynamique'
                    ? '#c084fc'
                  : state === 'Confort'
                    ? '#f472b6'
                  : '#94a3b8'} !important;

                filter:
                  ${state === 'Économie énergie'
                    ? 'drop-shadow(0 0 8px rgba(34,211,238,0.35))'
                  : state === 'Réinjection autorisée'
                    ? 'drop-shadow(0 0 8px rgba(56,189,248,0.35))'
                  : state === 'Réinjection refusée'
                    ? 'drop-shadow(0 0 8px rgba(251,113,133,0.35))'
                  : state === 'ECS solaire'
                    ? 'drop-shadow(0 0 8px rgba(251,191,36,0.35))'
                  : state === 'Tarification dynamique'
                    ? 'drop-shadow(0 0 8px rgba(192,132,252,0.35))'
                  : state === 'Confort'
                    ? 'drop-shadow(0 0 8px rgba(244,114,182,0.35))'
                  : 'none'};
              }

              .bubble-name {
                font-size: 10px !important;
                font-weight: 800 !important;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                color: rgba(255,255,255,0.38) !important;
                margin-bottom: 2px !important;
              }

              .bubble-state {
                font-size: 18px !important;
                font-weight: 850 !important;
                letter-spacing: -0.2px;

                color:
                  ${state === 'Économie énergie'
                    ? '#a5f3fc'
                  : state === 'Réinjection autorisée'
                    ? '#bae6fd'
                  : state === 'Réinjection refusée'
                    ? '#fecdd3'
                  : state === 'ECS solaire'
                    ? '#fde68a'
                  : state === 'Tarification dynamique'
                    ? '#e9d5ff'
                  : state === 'Confort'
                    ? '#fbcfe8'
                  : '#f8fafc'} !important;
              }

              .bubble-select-card {
                border-radius: 16px !important;
                background: rgba(255,255,255,0.035) !important;
                border: 1px solid rgba(255,255,255,0.05) !important;
              }

              .bubble-dropdown-container {
                background: rgba(255,255,255,0.03) !important;
                border-radius: 14px !important;
              }
          - type: custom:bubble-card
            card_type: select
            entity: [[foxcat:pricing.network_policy]]
            grid_options:
              columns: 6
          - type: custom:bubble-card
            card_type: select
            entity: [[foxcat:pricing.regime]]
            grid_options:
              columns: 6
      - type: grid
        cards:
          - type: custom:button-card
            show_name: false
            show_state: false
            show_icon: false
            grid_options:
              columns: full
            custom_fields:
              main: |
                [[[
                  /* ==========================================================
                     FOXCAT ENERGY V1.3.200 — COCKPIT EMS
                     Données prioritaires : entités natives FoxCat Energy.
                     Fallbacks conservés uniquement pour les mesures journalières
                     et pour faciliter la migration depuis l'ancienne carte.
                     ========================================================== */

                  const norm = (value) => String(value ?? '')
                    .normalize('NFD')
                    .replace(/[\u0300-\u036f]/g, '')
                    .toLowerCase()
                    .replace(/[^a-z0-9]+/g, ' ')
                    .trim();

                  const entityExists = (id) => !!(id && states[id]);

                  const findFox = (domain, words = [], candidates = []) => {
                    for (const id of candidates) {
                      if (entityExists(id)) return id;
                    }

                    const wanted = words.map(norm).filter(Boolean);
                    const prefix = `${domain}.`;
                    const ids = Object.keys(states).filter((id) => id.startsWith(prefix));

                    const match = ids.find((id) => {
                      const st = states[id];
                      const friendly = st?.attributes?.friendly_name || '';
                      const haystack = norm(`${id} ${friendly}`);
                      const isFox = haystack.includes('foxcat energy') || norm(id).includes('foxcat energy');
                      return isFox && wanted.every((w) => haystack.includes(w));
                    });

                    return match || null;
                  };

                  const stateOf = (id, fallback = '—') => {
                    if (!id || !states[id]) return fallback;
                    const value = states[id].state;
                    if (value === undefined || value === null || value === '' ||
                        value === 'unknown' || value === 'unavailable') return fallback;
                    return value;
                  };

                  const numberOf = (id, fallback = 0) => {
                    const value = Number.parseFloat(stateOf(id, ''));
                    return Number.isFinite(value) ? value : fallback;
                  };

                  const isOn = (id) => id && states[id]?.state === 'on';

                  const fmtW = (value) => {
                    const v = Math.abs(Number(value) || 0);
                    return v >= 1000 ? `${(v / 1000).toFixed(2)} kW` : `${Math.round(v)} W`;
                  };

                  const fmtSignedW = (value) => {
                    const n = Number(value) || 0;
                    const sign = n > 0 ? '+' : n < 0 ? '−' : '';
                    return `${sign}${fmtW(n)}`;
                  };

                  const fmtPct = (value) => `${Math.round(Number(value) || 0)} %`;
                  const fmtKwh = (value) => `${Number(value || 0).toFixed(1)} kWh`;
                  const fmtEuro = (value) => `${Number(value || 0).toFixed(2)} €`;
                  const clamp = (value, min, max) => Math.min(Math.max(Number(value) || 0, min), max);

                  /* ==========================================================
                     RÉSOLUTION DES ENTITÉS NATIVES FOXCAT
                     ========================================================== */

                  const E = {
                    mode: findFox('select', ['mode', 'ems'], [
                      '[[foxcat:ems.mode]]'
                    ]),

                    regulation: findFox('switch', ['regulation', 'foxcat', 'active'], [
                      '[[foxcat:ems.regulation_active]]'
                    ]),

                    dataValid: findFox('binary_sensor', ['donnees', 'energetiques', 'valides']),

                    phase: findFox('sensor', ['phase', 'regulation']),
                    coreAck: findFox('sensor', ['validation', 'execution', 'ems']),
                    lastDecision: findFox('sensor', ['derniere', 'decision', 'ems']),

                    pv: findFox('sensor', ['puissance', 'production', 'photovoltaique'], [
                      '[[foxcat:energy.pv_power]]'
                    ]),
                    house: findFox('sensor', ['puissance', 'consommation', 'maison'], [
                      '[[foxcat:energy.house_power]]'
                    ]),
                    export: findFox('sensor', ['puissance', 'reinjectee', 'reseau'], [
                      '[[foxcat:energy.grid_export]]'
                    ]),
                    import: findFox('sensor', ['puissance', 'prelevee', 'reseau'], [
                      '[[foxcat:energy.grid_import]]'
                    ]),
                    gridNet: findFox('sensor', ['puissance', 'nette', 'reseau'], [
                      '[[foxcat:energy.grid_power]]'
                    ]),

                    priLevel: findFox('sensor', ['niveau', 'puissance', 'pri', 'actuel']),
                    priTarget: findFox('sensor', ['niveau', 'puissance', 'pri', 'cible']),
                    priDirection: findFox('sensor', ['direction', 'pri']),
                    priCode: findFox('sensor', ['code', 'rrcr']),
                    priAckRrcr: findFox('sensor', ['ack', 'rrcr']),
                    priAckInverter: findFox('sensor', ['ack', 'onduleur']),
                    priAckGrid: findFox('sensor', ['ack', 'reseau']),
                    priReason: findFox('sensor', ['derniere', 'decision', 'pri']),

                    boilerTemp: findFox('sensor', ['temperature', 'chauffe', 'eau']),
                    boilerPower: findFox('sensor', ['puissance', 'chauffe', 'eau']),
                    boilerDemand: findFox('sensor', ['demande', 'chauffe', 'eau']),
                    boilerOrigin: findFox('sensor', ['origine', 'demande', 'chauffe', 'eau']),
                    boilerExec: findFox('sensor', ['etat', 'execution', 'chauffe', 'eau']),
                    boilerPhysical: findFox('binary_sensor', ['boiler', 'physique']),

                    solarWindow: findFox('binary_sensor', ['fenetre', 'solaire', 'exploitable']),
                    solarConfidence: findFox('sensor', ['confiance', 'solaire']),
                    solarPotential: findFox('sensor', ['potentiel', 'solaire']),
                    solarTrend: findFox('sensor', ['tendance', 'solaire']),
                    solarStart: findFox('sensor', ['debut', 'fenetre', 'solaire']),
                    solarEnd: findFox('sensor', ['fin', 'fenetre', 'solaire']),
                    solarReason: findFox('sensor', ['raison', 'prevision', 'solaire']),

                    buyPrice: findFox('sensor', ['prix', 'achat', 'actif']),
                    tariffPeriod: findFox('sensor', ['periode', 'tarifaire']),
                    priceStatus: findFox('sensor', ['statut', 'prix'])
                  };

                  /* ==========================================================
                     VALEURS INSTANTANÉES
                     ========================================================== */

                  const pv = Math.max(numberOf(E.pv, numberOf('[[foxcat:sources.pv]]', 0)), 0);
                  const house = Math.max(numberOf(E.house, numberOf('[[foxcat:legacy.sensor_consommation_reelle_maison]]', 0)), 0);
                  const gridExport = Math.max(numberOf(E.export, numberOf('[[foxcat:sources.grid_fallback]]', 0)), 0);
                  const gridImport = Math.max(numberOf(E.import, numberOf('[[foxcat:sources.grid_signed]]', 0)), 0);
                  const gridNet = E.gridNet ? numberOf(E.gridNet, gridExport - gridImport) : gridExport - gridImport;

                  const solarCover = house > 0 ? clamp((pv / house) * 100, 0, 100) : (pv > 0 ? 100 : 0);

                  const priLevel = clamp(numberOf(E.priLevel, 100), 0, 100);
                  const priTarget = clamp(numberOf(E.priTarget, priLevel), 0, 100);
                  const priDirection = stateOf(E.priDirection, 'maintien');
                  const priCode = stateOf(E.priCode, '—');
                  const priAckRrcr = stateOf(E.priAckRrcr, '—');
                  const priAckInverter = stateOf(E.priAckInverter, '—');
                  const priAckGrid = stateOf(E.priAckGrid, '—');
                  const priReason = stateOf(E.priReason, 'Aucune décision PRI disponible.');

                  const boilerTemp = numberOf(E.boilerTemp,
                    numberOf('[[foxcat:boiler.temperature_source]]', 0));
                  const boilerPower = Math.max(numberOf(E.boilerPower,
                    numberOf('[[foxcat:boiler.power_source]]', 0)), 0);
                  const boilerRunning = E.boilerPhysical ? isOn(E.boilerPhysical) : boilerPower > 200;
                  const boilerDemand = stateOf(E.boilerDemand, 'AUCUNE');
                  const boilerOrigin = stateOf(E.boilerOrigin, 'AUCUNE');
                  const boilerExec = stateOf(E.boilerExec, boilerRunning ? 'EN COURS' : 'IDLE');

                  const solarWindow = isOn(E.solarWindow);
                  const solarConfidence = clamp(numberOf(E.solarConfidence, 0), 0, 100);
                  const solarPotential = stateOf(E.solarPotential, 'Aucun');
                  const solarTrend = stateOf(E.solarTrend, '—');
                  const solarStart = stateOf(E.solarStart, '--:--');
                  const solarEnd = stateOf(E.solarEnd, '--:--');
                  const solarReason = stateOf(E.solarReason, 'Aucune analyse solaire disponible.');

                  const mode = stateOf(E.mode, 'Inconnu');
                  const regulationActive = E.regulation ? isOn(E.regulation) : true;
                  const dataValid = E.dataValid ? isOn(E.dataValid) : true;
                  const phase = stateOf(E.phase, '—');
                  const coreAck = stateOf(E.coreAck, '—');
                  const lastDecision = stateOf(E.lastDecision, 'Aucune décision EMS disponible.');

                  /* ==========================================================
                     TARIF NATIF FOXCAT
                     ========================================================== */

                  const buyPrice = numberOf(E.buyPrice,
                    numberOf('[[foxcat:pricing.source.current]]', 0));
                  const tariffPeriod = stateOf(E.tariffPeriod, '—');
                  const priceStatus = stateOf(E.priceStatus, '—');

                  /* ==========================================================
                     BILAN JOURNALIER — capteurs historiques conservés
                     ========================================================== */

                  const productionToday = Math.max(numberOf('[[foxcat:legacy.sensor_homefoxcat_total_production_today]]', 0), 0);
                  const consumptionToday = Math.max(numberOf('[[foxcat:legacy.sensor_consommation_jour]]', 0), 0);
                  const injectionToday = Math.max(numberOf('[[foxcat:legacy.sensor_reinjection_jour]]', 0), 0);
                  const selfConsumed = Math.max(productionToday - injectionToday, 0);
                  const selfConsumption = productionToday > 0 ? clamp((selfConsumed / productionToday) * 100, 0, 100) : 0;
                  const gridEnergyToday = Math.max(consumptionToday - selfConsumed, 0);
                  const dailyCost = gridEnergyToday * Math.max(buyPrice, 0);

                  /* ==========================================================
                     COULEURS / ÉTATS
                     ========================================================== */

                  const modeMap = {
                    'Économie énergie': ['🌿', '#34d399'],
                    'Economie énergie': ['🌿', '#34d399'],
                    'ECS solaire': ['♨️', '#fb923c'],
                    'Zéro injection': ['⛔', '#fb7185'],
                    'Prix dynamique': ['📈', '#a78bfa'],
                    'Manuel': ['🖐️', '#60a5fa']
                  };
                  const [modeIcon, modeColor] = modeMap[mode] || ['⚡', '#c4b5fd'];

                  let gridIcon = '⚖️';
                  let gridLabel = 'Équilibre';
                  let gridColor = '#94a3b8';
                  let gridValue = 0;

                  if (gridExport > 20) {
                    gridIcon = '↗';
                    gridLabel = 'Réinjection';
                    gridColor = '#34d399';
                    gridValue = gridExport;
                  } else if (gridImport > 20) {
                    gridIcon = '↙';
                    gridLabel = 'Prélèvement';
                    gridColor = '#fb7185';
                    gridValue = gridImport;
                  }

                  let priColor = '#34d399';
                  if (priLevel < 100) priColor = '#facc15';
                  if (priAckRrcr === 'FAILED' || priAckInverter === 'FAILED' || priAckGrid === 'FAILED') priColor = '#fb7185';
                  if (String(priAckGrid).toUpperCase().includes('PENDING')) priColor = '#60a5fa';

                  const priArrow = priTarget > priLevel ? '↑' : priTarget < priLevel ? '↓' : '→';

                  const boilerColor = boilerRunning ? '#fb923c' : '#94a3b8';
                  const solarColor = solarWindow ? '#facc15' : '#64748b';
                  const systemColor = regulationActive && dataValid ? '#34d399' : '#fb7185';

                  /* ==========================================================
                     RENDU
                     ========================================================== */

                  return `
                    <div class="foxcat">

                      <div class="header">
                        <div>
                          <div class="brand"><span>FOX</span><span class="cat">CAT</span><span class="energy">ENERGY</span></div>
                          <div class="subtitle">EMS V1.3.200 · COCKPIT TEMPS RÉEL</div>
                        </div>
                        <div class="system-pill" style="color:${systemColor};border-color:${systemColor}35;background:${systemColor}10;">
                          <span class="live-dot" style="background:${systemColor};box-shadow:0 0 10px ${systemColor};"></span>
                          ${regulationActive ? (dataValid ? 'EMS ACTIF' : 'DONNÉES INVALIDES') : 'EMS EN VEILLE'}
                        </div>
                      </div>

                      <div class="topline">
                        <div>
                          <div class="eyebrow">MODE ACTUEL</div>
                          <div class="mode" style="color:${modeColor};">${modeIcon} ${mode}</div>
                        </div>
                        <div class="core-mini">
                          <span>CORE <b>${phase}</b></span>
                          <span>ACK <b>${coreAck}</b></span>
                        </div>
                      </div>

                      <div class="realtime-grid">

                        <div class="rt-card pv-card">
                          <div class="rt-head"><span>☀️</span><span>PV ACTUEL</span></div>
                          <div class="rt-value pv">${fmtW(pv)}</div>
                          <div class="rt-sub">Production photovoltaïque</div>
                          <div class="mini-bar"><div class="mini-fill solar" style="width:${solarCover}%;"></div></div>
                          <div class="rt-foot"><span>Couverture maison</span><b>${Math.round(solarCover)} %</b></div>
                        </div>

                        <div class="rt-card grid-card">
                          <div class="rt-head"><span style="color:${gridColor};">${gridIcon}</span><span>RÉSEAU</span></div>
                          <div class="rt-value" style="color:${gridColor};">${fmtW(gridValue)}</div>
                          <div class="rt-sub" style="color:${gridColor};">${gridLabel}</div>
                          <div class="rt-foot"><span>Export</span><b>${fmtW(gridExport)}</b></div>
                          <div class="rt-foot"><span>Import</span><b>${fmtW(gridImport)}</b></div>
                          <div class="rt-foot"><span>Net FoxCat</span><b>${fmtSignedW(gridNet)}</b></div>
                        </div>

                        <div class="rt-card pri-card">
                          <div class="rt-head"><span>⚙️</span><span>ONDULEUR SOLAREDGE</span></div>
                          <div class="pri-main">
                            <div class="rt-value" style="color:${priColor};">${Math.round(priLevel)} %</div>
                            <div class="pri-target">${priArrow} ${Math.round(priTarget)} %</div>
                          </div>
                          <div class="mini-bar"><div class="mini-fill pri" style="width:${priLevel}%;background:${priColor};"></div></div>
                          <div class="rt-foot"><span>Direction</span><b>${priDirection}</b></div>
                          <div class="rt-foot"><span>RRCR</span><b>${priCode}</b></div>
                          <div class="ack-row">
                            <span class="ack-chip">RRCR ${priAckRrcr}</span>
                            <span class="ack-chip">INV ${priAckInverter}</span>
                            <span class="ack-chip">RÉSEAU ${priAckGrid}</span>
                          </div>
                        </div>

                        <div class="rt-card boiler-card">
                          <div class="rt-head"><span>♨️</span><span>BOILER</span></div>
                          <div class="boiler-main">
                            <div class="rt-value">${boilerTemp.toFixed(1)}°</div>
                            <div class="boiler-state" style="color:${boilerColor};">${boilerRunning ? '● CHAUFFE' : '○ ATTENTE'}</div>
                          </div>
                          <div class="rt-foot"><span>Puissance</span><b>${fmtW(boilerPower)}</b></div>
                          <div class="rt-foot"><span>Demande</span><b>${boilerDemand}</b></div>
                          <div class="rt-foot"><span>Origine</span><b>${boilerOrigin}</b></div>
                          <div class="rt-foot"><span>Exécution</span><b>${boilerExec}</b></div>
                        </div>

                      </div>

                      <div class="solar-panel" style="border-color:${solarColor}30;">
                        <div class="section-head">
                          <div><span class="section-icon">🌤️</span> EMS 2 · SOLAIRE</div>
                          <div class="solar-status" style="color:${solarColor};">${solarWindow ? '● FENÊTRE EXPLOITABLE' : '○ SURVEILLANCE'}</div>
                        </div>

                        <div class="solar-grid">
                          <div class="solar-stat"><span>Confiance</span><b>${fmtPct(solarConfidence)}</b></div>
                          <div class="solar-stat"><span>Potentiel</span><b>${solarPotential}</b></div>
                          <div class="solar-stat"><span>Tendance</span><b>${solarTrend}</b></div>
                          <div class="solar-stat"><span>Fenêtre</span><b>${solarStart} → ${solarEnd}</b></div>
                        </div>

                        <div class="confidence-bar"><div style="width:${solarConfidence}%;"></div></div>
                        <div class="reason">${solarReason}</div>
                      </div>

                      <div class="decision-grid">
                        <div class="decision-card">
                          <div class="decision-title">⚡ DERNIÈRE DÉCISION EMS</div>
                          <div class="decision-text">${lastDecision}</div>
                        </div>
                        <div class="decision-card">
                          <div class="decision-title">⚙️ DERNIÈRE DÉCISION ONDULEUR</div>
                          <div class="decision-text">${priReason}</div>
                        </div>
                      </div>

                      <div class="tariff-row">
                        <div><span>Tarif FoxCat</span><b>${tariffPeriod}</b></div>
                        <div><span>Prix achat actif</span><b>${buyPrice.toFixed(3)} €/kWh</b></div>
                        <div><span>Statut prix</span><b>${priceStatus}</b></div>
                      </div>

                      <div class="today">
                        <div class="section-head"><div>AUJOURD’HUI</div><div class="section-muted">bilan énergétique</div></div>
                        <div class="today-grid">
                          <div class="today-item"><span>☀️</span><b>${fmtKwh(productionToday)}</b><small>Production</small></div>
                          <div class="today-item"><span>🏠</span><b>${fmtKwh(consumptionToday)}</b><small>Consommation</small></div>
                          <div class="today-item"><span>↗️</span><b>${fmtKwh(injectionToday)}</b><small>Injection</small></div>
                          <div class="today-item"><span>♻️</span><b>${fmtPct(selfConsumption)}</b><small>Autoconsommation</small></div>
                          <div class="today-item"><span>💶</span><b>${fmtEuro(dailyCost)}</b><small>Coût estimé</small></div>
                        </div>
                      </div>

                      <div class="footer">
                        <span>FOXCAT ENERGY V1.3.200</span>
                        <span>Données natives FoxCat · temps réel</span>
                      </div>
                    </div>
                  `;
                ]]]
            styles:
              grid:
                - grid-template-areas: '"main"'
                - grid-template-columns: 1fr
                - grid-template-rows: auto
              card:
                - padding: 0
                - border-radius: 30px
                - overflow: hidden
                - border: 1px solid rgba(255,255,255,0.07)
                - background: >-
                    radial-gradient(circle at 92% 0%, rgba(34,211,238,.08),
                    transparent 28%), radial-gradient(circle at 0% 100%,
                    rgba(251,146,60,.07), transparent 30%),
                    linear-gradient(145deg,#070b14 0%,#0c1320 45%,#101827 100%)
                - box-shadow: 0 18px 55px rgba(0,0,0,.32)
              custom_fields:
                main:
                  - width: 100%
            extra_styles: >
              * { box-sizing: border-box; }


              .foxcat {
                padding: 22px;
                color: #f8fafc;
                font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
              }


              .header, .topline, .section-head, .rt-foot, .boiler-main,
              .pri-main, .footer {
                display: flex;
                align-items: center;
                justify-content: space-between;
              }


              .header { gap: 14px; }

              .brand { font-size: 21px; font-weight: 950; letter-spacing: 1.5px;
              }

              .brand .cat { color: #fb923c; }

              .brand .energy { margin-left: 7px; color: #22d3ee; font-size:
              11px; letter-spacing: 2.5px; }

              .subtitle { margin-top: 4px; color: #64748b; font-size: 9px;
              letter-spacing: .8px; }


              .system-pill {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 8px 11px;
                border-radius: 20px;
                border: 1px solid;
                font-size: 9px;
                font-weight: 900;
                letter-spacing: .8px;
                white-space: nowrap;
              }


              .live-dot { width: 7px; height: 7px; border-radius: 50%; }


              .topline {
                margin-top: 20px;
                padding-bottom: 16px;
                border-bottom: 1px solid rgba(255,255,255,.06);
              }


              .eyebrow { color: #64748b; font-size: 9px; font-weight: 800;
              letter-spacing: 1.4px; }

              .mode { margin-top: 5px; font-size: 18px; font-weight: 950; }

              .core-mini { display: flex; gap: 7px; flex-wrap: wrap;
              justify-content: flex-end; }

              .core-mini span { padding: 6px 8px; border-radius: 10px;
              background: rgba(255,255,255,.035); color: #64748b; font-size:
              8px; }

              .core-mini b { color: #e2e8f0; }


              .realtime-grid {
                display: grid;
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 10px;
                margin-top: 16px;
              }


              .rt-card {
                min-width: 0;
                padding: 14px;
                border-radius: 19px;
                border: 1px solid rgba(255,255,255,.05);
                background: rgba(255,255,255,.026);
              }


              .pv-card { background: radial-gradient(circle at 100% 0%,
              rgba(250,204,21,.09), transparent 48%), rgba(255,255,255,.026); }

              .grid-card { background: radial-gradient(circle at 100% 0%,
              rgba(96,165,250,.08), transparent 48%), rgba(255,255,255,.026); }

              .pri-card { background: radial-gradient(circle at 100% 0%,
              rgba(167,139,250,.09), transparent 48%), rgba(255,255,255,.026); }

              .boiler-card { background: radial-gradient(circle at 100% 0%,
              rgba(251,146,60,.09), transparent 48%), rgba(255,255,255,.026); }


              .rt-head { display: flex; align-items: center; gap: 7px; color:
              #94a3b8; font-size: 9px; font-weight: 900; letter-spacing: .9px; }

              .rt-value { margin-top: 10px; font-size: 27px; font-weight: 950;
              letter-spacing: -.5px; }

              .rt-value.pv { color: #facc15; }

              .rt-sub { margin-top: 1px; color: #64748b; font-size: 8px; }


              .rt-foot { gap: 12px; margin-top: 8px; padding-top: 7px;
              border-top: 1px solid rgba(255,255,255,.04); color: #64748b;
              font-size: 8px; }

              .rt-foot b { color: #e2e8f0; font-size: 9px; text-align: right;
              overflow: hidden; text-overflow: ellipsis; }


              .mini-bar { height: 6px; margin-top: 10px; border-radius: 10px;
              overflow: hidden; background: rgba(255,255,255,.07); }

              .mini-fill { height: 100%; border-radius: 10px; transition: width
              .4s ease; }

              .mini-fill.solar { background:
              linear-gradient(90deg,#f59e0b,#facc15,#34d399); }


              .pri-main { margin-top: 1px; gap: 10px; }

              .pri-target { padding: 6px 9px; border-radius: 10px; background:
              rgba(255,255,255,.035); color: #cbd5e1; font-size: 12px;
              font-weight: 900; }


              .ack-row { display: grid; grid-template-columns: repeat(3,1fr);
              gap: 5px; margin-top: 8px; }

              .ack-chip { padding: 5px 4px; border-radius: 8px; background:
              rgba(255,255,255,.035); color: #94a3b8; font-size: 6.5px;
              font-weight: 800; text-align: center; white-space: nowrap;
              overflow: hidden; text-overflow: ellipsis; }


              .boiler-state { font-size: 9px; font-weight: 900; }


              .solar-panel {
                margin-top: 12px;
                padding: 14px;
                border-radius: 19px;
                border: 1px solid;
                background: radial-gradient(circle at 100% 0%, rgba(250,204,21,.06), transparent 50%), rgba(255,255,255,.022);
              }


              .section-head { color: #94a3b8; font-size: 9px; font-weight: 900;
              letter-spacing: .9px; gap: 10px; }

              .section-icon { font-size: 15px; }

              .section-muted { color: #475569; font-weight: 500; }

              .solar-status { font-size: 8px; letter-spacing: .6px; }


              .solar-grid { display: grid; grid-template-columns: repeat(4,1fr);
              gap: 7px; margin-top: 12px; }

              .solar-stat { min-width: 0; padding: 9px 7px; border-radius: 11px;
              background: rgba(255,255,255,.026); text-align: center; }

              .solar-stat span { display: block; color: #64748b; font-size: 7px;
              }

              .solar-stat b { display: block; margin-top: 4px; color: #e2e8f0;
              font-size: 9px; overflow: hidden; text-overflow: ellipsis;
              white-space: nowrap; }


              .confidence-bar { height: 5px; margin-top: 10px; border-radius:
              10px; overflow: hidden; background: rgba(255,255,255,.06); }

              .confidence-bar div { height: 100%; border-radius: 10px;
              background: linear-gradient(90deg,#64748b,#facc15,#34d399); }

              .reason { margin-top: 9px; color: #94a3b8; font-size: 8px;
              line-height: 1.35; }


              .decision-grid { display: grid; grid-template-columns:
              repeat(2,1fr); gap: 10px; margin-top: 12px; }

              .decision-card { min-width: 0; padding: 12px; border-radius: 15px;
              border: 1px solid rgba(255,255,255,.045); background:
              rgba(255,255,255,.022); }

              .decision-title { color: #94a3b8; font-size: 8px; font-weight:
              900; letter-spacing: .7px; }

              .decision-text { margin-top: 6px; color: #cbd5e1; font-size: 8px;
              line-height: 1.35; }


              .tariff-row { display: grid; grid-template-columns: repeat(3,1fr);
              gap: 7px; margin-top: 12px; }

              .tariff-row > div { padding: 9px; border-radius: 12px; background:
              rgba(255,255,255,.022); border: 1px solid rgba(255,255,255,.04);
              text-align: center; }

              .tariff-row span { display: block; color: #64748b; font-size: 7px;
              }

              .tariff-row b { display: block; margin-top: 3px; color: #e2e8f0;
              font-size: 9px; }


              .today { margin-top: 12px; padding: 14px; border-radius: 18px;
              background: rgba(255,255,255,.022); border: 1px solid
              rgba(255,255,255,.045); }

              .today-grid { display: grid; grid-template-columns: repeat(5,1fr);
              gap: 7px; margin-top: 11px; }

              .today-item { padding: 8px 4px; border-radius: 11px; background:
              rgba(255,255,255,.018); text-align: center; }

              .today-item span { display: block; font-size: 16px; }

              .today-item b { display: block; margin-top: 4px; color: #f8fafc;
              font-size: 10px; }

              .today-item small { display: block; margin-top: 2px; color:
              #64748b; font-size: 6.5px; }


              .footer { gap: 10px; margin-top: 14px; padding-top: 10px;
              border-top: 1px solid rgba(255,255,255,.04); color: #475569;
              font-size: 7px; letter-spacing: .7px; }


              @media (max-width: 700px) {
                .foxcat { padding: 15px; }
                .realtime-grid { grid-template-columns: 1fr; }
                .solar-grid { grid-template-columns: repeat(2,1fr); }
                .decision-grid { grid-template-columns: 1fr; }
                .today-grid { grid-template-columns: repeat(2,1fr); }
                .tariff-row { grid-template-columns: 1fr; }
                .topline { align-items: center; gap: 10px; }
                .core-mini { max-width: 45%; }
                .mode { font-size: 15px; }
                .brand { font-size: 18px; }
                .system-pill { padding: 6px 8px; font-size: 7.5px; }
              }
            tap_action:
              action: none
            hold_action:
              action: none
            double_tap_action:
              action: none
