                          </div>
                          <div style="font-size:17px;font-weight:700;margin-top:3px;">
                            ${pv.toFixed(0)} W
                          </div>
                        </div>

                        <div style="
                          padding:11px;
                          border-radius:14px;
                          background:rgba(34,211,238,0.06);
                        ">
                          <div style="font-size:10px;opacity:0.5;">
                            ⚡ Surplus réel
