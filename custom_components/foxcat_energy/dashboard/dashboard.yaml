                        <span>
                          Modèle
                        </span>

                        <strong>
                          ESTIMATION COMPENSATION
                        </strong>

                      </div>

                    </div>

                  `;


                  const tariffHtml =
                    isDynamic
                      ? dynamicHtml
                      : isTou
                        ? touHtml
                        : compensationHtml;


                  /* ==========================================================
                     RENDU
