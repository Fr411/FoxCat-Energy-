                          <span>
                            HEURES PLEINES
                          </span>

                          <ha-icon
                            icon="mdi:weather-sunny">
                          </ha-icon>

                        </div>


                        <div class="tariff-price">
                          ${fmtPrice(hpPrice)}
                        </div>


                        <div class="tariff-source">
                          Source · ${hpSource}
                        </div>

                      </div>



                      <div
                        class="
                          tariff-box
                          ${period === 'HC' ? 'active' : ''}
                        "
                        style="
                          --accent:#19d8ff;
                        "
                      >

                        <div class="tariff-head">

                          <span>
                            HEURES CREUSES
                          </span>

                          <ha-icon
                            icon="mdi:weather-night">
                          </ha-icon>

                        </div>


                        <div class="tariff-price">
                          ${fmtPrice(hcPrice)}
                        </div>


                        <div class="tariff-source">
                          Source · ${hcSource}
                        </div>

                      </div>

                    </div>



                    <div
                      class="period"
                      style="
                        --accent:${
                          period === 'HP'
                            ? '#ff922b'
                            : '#19d8ff'
                        };
                      "
                    >

                      <div class="period-icon">

                        <ha-icon
                          icon="${
                            period === 'HP'
                              ? 'mdi:clock-alert-outline'
