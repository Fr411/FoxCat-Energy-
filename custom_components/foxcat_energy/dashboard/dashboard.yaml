                  else if (score >= 75) scoreLabel = 'Très agressif';
                  else if (score >= 50) scoreLabel = 'Agressif';
                  else if (score >= 25) scoreLabel = 'Modéré';
                  else if (score > 0) scoreLabel = 'Prudent';

                  return `
