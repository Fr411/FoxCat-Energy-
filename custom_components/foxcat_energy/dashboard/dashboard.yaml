                why:
                  - width: 100%
                energy:
                  - width: 100%
                thermal:
                  - width: 100%
                decision:
                  - width: 100%
            custom_fields:
              hero: |
                [[[
                  const temp =
                    Number(
                      states['[[foxcat:boiler.temperature_source]]']?.state || 0
                    );

                  const power =
                    Number(
                      states['[[foxcat:boiler.power_source]]']?.state || 0
                    );

                  const boilerOn =
                    states['[[foxcat:boiler.binary_source]]']?.state === 'on'
                    || power > 200;

                  const demand =
                    states['[[foxcat:legacy.input_select_ems_boiler_demande]]']?.state || 'AUCUNE';

                  const score =
                    Number(
                      states['[[foxcat:legacy.input_number_ems_agressivite_score]]']?.state || 0
                    );

                  let title = 'EN ATTENTE';
                  let subtitle = 'FoxCat surveille les conditions';
                  let icon = '⏸️';
                  let accent = '#64748B';

                  if (temp >= 65) {
                    title = 'STOCKAGE COMPLET';
                    subtitle = 'Limite de boost atteinte';
                    icon = '✅';
                    accent = '#10B981';
                  }
                  else if (demand === 'BOOST_65' && boilerOn) {
                    title = 'BOOST SOLAIRE';
                    subtitle = 'Stockage thermique jusqu’à 65 °C';
                    icon = '☀️';
                    accent = '#F59E0B';
                  }
                  else if (demand === 'CHAUFFE_45' && boilerOn) {
                    title = 'CHAUFFE CONFORT';
                    subtitle = 'FoxCat sécurise les 45 °C';
                    icon = '🔥';
                    accent = '#22D3EE';
                  }
                  else if (demand === 'ARRET') {
                    title = 'ARRÊT';
                    subtitle = 'La chauffe n’est actuellement pas utile';
                    icon = '⏹️';
                    accent = '#64748B';
                  }
                  else if (score > 0) {
                    title = 'OPPORTUNITÉ SOLAIRE';
                    subtitle = 'FoxCat évalue un stockage thermique';
                    icon = '🧠';
                    accent = '#A78BFA';
                  }

                  return `
                    <div style="
                      padding:20px;
                      background:
                        linear-gradient(
                          135deg,
                          ${accent}22,
                          transparent 65%
                        );
                    ">

                      <div style="
                        display:flex;
                        align-items:center;
                        justify-content:space-between;
                        gap:14px;
                      ">

                        <div>

                          <div style="
                            font-size:11px;
                            letter-spacing:1.4px;
                            opacity:0.55;
                            font-weight:700;
                          ">
                            FOXCAT ENERGY · BOILER
                          </div>

                          <div style="
                            font-size:24px;
                            font-weight:800;
                            margin-top:4px;
                          ">
                            ${icon} ${title}
                          </div>

                          <div style="
                            font-size:13px;
                            opacity:0.7;
                            margin-top:4px;
                          ">
                            ${subtitle}
                          </div>

                        </div>

                        <div style="
                          text-align:right;
                        ">

                          <div style="
                            font-size:36px;
                            font-weight:800;
                            line-height:1;
                          ">
                            ${temp.toFixed(1)}°
                          </div>

                          <div style="
                            font-size:12px;
                            opacity:0.6;
                            margin-top:5px;
                          ">
                            ${power.toFixed(0)} W
                          </div>

                        </div>

                      </div>

                      <div style="
                        height:6px;
                        border-radius:10px;
                        background:rgba(255,255,255,0.08);
                        overflow:hidden;
                        margin-top:18px;
                      ">

                        <div style="
                          height:100%;
                          width:${Math.min(100, Math.max(0, ((temp - 25) / 40) * 100))}%;
                          background:${accent};
                          border-radius:10px;
                        "></div>

                      </div>

                      <div style="
                        display:flex;
                        justify-content:space-between;
                        font-size:10px;
                        opacity:0.45;
                        margin-top:5px;
                      ">
                        <span>25 °C</span>
                        <span>45 °C confort</span>
                        <span>65 °C boost</span>
                      </div>

                    </div>
                  `;
                ]]]
              why: |
                [[[
                  const reason =
                    states['[[foxcat:legacy.input_text_ems_agressivite_raison]]']?.state
                    || 'Aucune optimisation particulière nécessaire';

                  const demand =
                    states['[[foxcat:legacy.input_select_ems_boiler_demande]]']?.state || 'AUCUNE';

                  const temp =
                    Number(
                      states['[[foxcat:boiler.temperature_source]]']?.state || 0
                    );

                  let headline = '';

                  if (demand === 'CHAUFFE_45') {
                    headline =
                      'Le confort sanitaire est prioritaire : FoxCat vise au minimum 45 °C.';
                  }
                  else if (demand === 'BOOST_65') {
                    headline =
