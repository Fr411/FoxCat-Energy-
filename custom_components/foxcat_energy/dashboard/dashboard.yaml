                      </div>


                      <div>

                        <div class="small-label">
                          PÉRIODE ACTUELLE
                        </div>

                        <div class="period-name">
                          ${period}
                        </div>

                      </div>


                      <div class="period-price">
                        ${fmtPrice(activeBuy)}
                      </div>

                    </div>



                    <div class="details-grid">


                      <div class="detail">

                        <span>
                          Prix réinjection
                        </span>

                        <strong>
                          ${fmtPrice(fixedInjection)}
                        </strong>

                      </div>


                      <div class="detail">

                        <span>
                          Statut du prix
                        </span>

                        <strong
                          style="
                            color:${statusColor};
                          "
