              thermal: |
                [[[
                  const temp =
                    Number(
                      states['[[foxcat:boiler.temperature_source]]']?.state || 0
                    );

                  const power =
                    Number(
                      states['[[foxcat:boiler.power_source]]']?.state || 0
                    );

                  const boilerEntity =
                    states['[[foxcat:boiler.binary_source]]'];

                  const boilerOn =
                    boilerEntity?.state === 'on'
                    || power > 200;

                  let onSeconds = 0;

                  if (boilerEntity?.state === 'on') {
                    const start = new Date(boilerEntity.last_changed).getTime();
                    onSeconds = Math.max(
                      0,
                      (Date.now() - start) / 1000
                    );
                  }

                  const minCycle =
                    Number(
                      states['[[foxcat:legacy.input_number_ems_boiler_cycle_min_secondes]]']?.state || 120
                    );

                  const cycleRemaining =
                    boilerOn
                      ? Math.max(0, minCycle - onSeconds)
                      : 0;

                  const now = new Date();
                  const minute = now.getHours() * 60 + now.getMinutes();

                  const hc =
                    minute < 420
                    || (minute >= 660 && minute < 1020)
                    || minute >= 1320;

                  let minutesFinHC = 9999;

                  if (minute < 420) {
                    minutesFinHC = 420 - minute;
                  }
                  else if (minute >= 660 && minute < 1020) {
                    minutesFinHC = 1020 - minute;
                  }
                  else if (minute >= 1320) {
                    minutesFinHC = (1440 - minute) + 420;
                  }

                  const perte = 0.5;
                  const chauffe = 10;
                  const marge = 30;

                  const tempFin =
                    minutesFinHC < 9999
                      ? temp - perte * (minutesFinHC / 60)
                      : temp;

                  const minutesChauffe =
                    minutesFinHC < 9999
                      ? Math.max(0, ((45 - tempFin) / chauffe) * 60)
                      : 0;

                  const failback =
                    minutesFinHC < 9999
                      ? minutesFinHC - minutesChauffe - marge
                      : 9999;

                  let phase = 'HORS HC';

                  if (minute >= 1320 && minute < 1380) {
                    phase = 'Observation nuit';
                  }
                  else if (minute >= 1380 && minute < 1400) {
                    phase = 'Charge initiale';
                  }
                  else if (minute >= 1400 && minute < 1430) {
                    phase = 'Stabilisation sonde';
                  }
                  else if (minute >= 1430 || minute < 420) {
                    phase = 'Failback thermique';
                  }
                  else if (minute >= 660 && minute < 1020) {
                    phase = 'HC solaire';
                  }

                  let failbackText = 'Non applicable';

                  if (hc) {
                    if (failback <= 0) {
                      failbackText = 'Départ requis maintenant';
                    }
                    else {
                      const h = Math.floor(failback / 60);
                      const m = Math.round(failback % 60);

                      failbackText =
                        h > 0
                          ? `dans ${h} h ${m} min`
                          : `dans ${m} min`;
                    }
                  }

                  let cycleText = 'Disponible';

                  if (boilerOn && cycleRemaining > 0) {
                    cycleText =
                      `${Math.ceil(cycleRemaining)} s minimum restant`;
                  }
                  else if (boilerOn) {
                    cycleText = 'Minimum 120 s respecté';
                  }

                  return `
                    <div style="
                      margin:0 16px 12px 16px;
                      padding:14px;
                      border-radius:16px;
                      background:rgba(255,255,255,0.04);
                    ">

                      <div style="
                        font-size:11px;
                        font-weight:800;
                        letter-spacing:0.8px;
                        opacity:0.55;
                        margin-bottom:9px;
                      ">
                        PILOTAGE THERMIQUE
                      </div>

                      <div style="
                        display:grid;
                        grid-template-columns:1fr auto;
                        row-gap:8px;
                        column-gap:10px;
                        font-size:12px;
                      ">

                        <span style="opacity:0.55;">
                          Phase actuelle
                        </span>
                        <b>${phase}</b>

                        <span style="opacity:0.55;">
                          Objectif confort
                        </span>
                        <b>45 °C</b>

                        <span style="opacity:0.55;">
                          Stockage maximum
                        </span>
                        <b>65 °C</b>

                        <span style="opacity:0.55;">
                          Temp. estimée fin HC
                        </span>
                        <b>${tempFin.toFixed(1)} °C</b>

                        <span style="opacity:0.55;">
                          Failback
                        </span>
                        <b>${failbackText}</b>

                        <span style="opacity:0.55;">
                          Cycle minimum
                        </span>
                        <b>${cycleText}</b>

                      </div>

                    </div>
                  `;
                ]]]
              decision: |
                [[[
                  const temp =
                    Number(
                      states['[[foxcat:boiler.temperature_source]]']?.state || 0
                    );

                  const demand =
                    states['[[foxcat:legacy.input_select_ems_boiler_demande]]']?.state || 'AUCUNE';

                  const score =
                    Number(
                      states['[[foxcat:legacy.input_number_ems_agressivite_score]]']?.state || 0
                    );

                  const importMax =
                    Number(
                      states['[[foxcat:legacy.input_number_ems_import_boiler_max_dynamique]]']?.state || 0
                    );

                  const coverage =
                    Number(
                      states['[[foxcat:legacy.input_number_ems_couverture_solaire_min_dynamique]]']?.state || 100
                    );

                  let text = '';

                  if (temp >= 65) {
                    text =
                      `Le boiler a atteint 65 °C. FoxCat arrête le stockage thermique même si du solaire reste disponible.`;
                  }
                  else if (demand === 'CHAUFFE_45') {
                    text =
                      `FoxCat chauffe actuellement pour garantir le confort. Sous 45 °C, le failback thermique reste prioritaire sur l'optimisation économique.`;
                  }
                  else if (demand === 'BOOST_65') {
                    text =
                      `Les 45 °C sont assurés. FoxCat continue la chauffe en mode BOOST pour stocker l'énergie disponible dans les 250 litres d'eau. ` +
                      `Dans les conditions actuelles, jusqu'à ${importMax.toFixed(0)} W de réseau peuvent être tolérés et la couverture solaire minimale est de ${coverage.toFixed(0)} %.`;
                  }
                  else if (score > 0) {
                    text =
                      `FoxCat détecte une opportunité solaire, mais attend encore que toutes les conditions soient réunies avant d'engager les 1 800 W du boiler.`;
                  }
                  else {
                    text =
                      `Aucune chauffe opportuniste n'est justifiée actuellement. FoxCat conserve l'énergie réseau et attend soit une meilleure fenêtre solaire, soit le déclenchement du failback confort.`;
                  }

                  return `
                    <div style="
                      margin:0 16px 16px 16px;
                      padding:15px;
                      border-radius:16px;
                      background:rgba(34,211,238,0.065);
                      border:1px solid rgba(34,211,238,0.15);
                    ">

                      <div style="
                        font-size:11px;
                        font-weight:800;
                        letter-spacing:0.8px;
                        margin-bottom:7px;
                      ">
                        CE QUE FOXCAT DÉCIDE
                      </div>

                      <div style="
                        font-size:13px;
                        line-height:1.55;
                      ">
                        ${text}
                      </div>

                      <div style="
                        margin-top:11px;
                        padding-top:10px;
                        border-top:1px solid rgba(255,255,255,0.08);
                        font-size:10px;
                        line-height:1.45;
                        opacity:0.5;
                      ">
                        Ordre de priorité :
                        sécurité → confort / failback → cycle minimum →
                        tarif → photovoltaïque → autoconsommation → boost thermique.
                      </div>

                    </div>
                  `;
                ]]]
          - type: custom:button-card
            entity: [[foxcat:boiler.temperature_source]]
            show_name: false
            show_state: false
            show_icon: false
            triggers_update:
              - [[foxcat:boiler.temperature_source]]
              - [[foxcat:boiler.power_source]]
              - [[foxcat:boiler.binary_source]]
              - [[foxcat:legacy.input_select_ems_boiler_demande]]
              - [[foxcat:legacy.input_select_ems_mode]]
              - [[foxcat:legacy.input_number_ems_boiler_temp_normal]]
            custom_fields:
              header: |
                [[[
                  const now = new Date();
                  const m = now.getHours() * 60 + now.getMinutes();

                  let phase = 'HORS HC';

                  if (m >= 1320 && m < 1380)
                    phase = 'OBSERVATION NUIT';

                  else if (m >= 1380 && m < 1400)
                    phase = 'CHARGE INITIALE';

                  else if (m >= 1400 && m < 1430)
                    phase = 'STABILISATION SONDE';

                  else if (m >= 1430 || m < 420)
                    phase = 'FAILBACK THERMIQUE';

                  else if (m >= 660 && m < 1020)
                    phase = 'HC SOLAIRE';

                  return `
                    <div class="header-line">
                      <div>
                        <div class="foxcat-title">FOXCAT ECS</div>
                        <div class="phase">${phase}</div>
                      </div>
                      <div class="mode">
                        ${states['[[foxcat:legacy.input_select_ems_boiler_demande]]']?.state || 'AUCUNE'}
                      </div>
                    </div>
                  `;
                ]]]
              time_now: |
                [[[
                  const now = new Date();

                  const hh = String(now.getHours()).padStart(2,'0');
                  const mm = String(now.getMinutes()).padStart(2,'0');

                  return `
                    <div class="main-value">${hh}:${mm}</div>
                    <div class="main-label">HEURE ACTUELLE</div>
                  `;
                ]]]
              next_start: |
                [[[
                  const t = parseFloat(
                    states['[[foxcat:boiler.temperature_source]]']?.state || 0
                  );

                  const target = parseFloat(
                    states['[[foxcat:legacy.input_number_ems_boiler_temp_normal]]']?.state || 45
                  );

                  const now = new Date();
                  const m = now.getHours() * 60 + now.getMinutes();

                  const loss = 0.5;
                  const heat = 10.0;
                  const margin = 30;

                  let end = null;
                  let remaining = null;

                  if (m < 420) {
                    end = new Date(now);
                    end.setHours(7,0,0,0);
                    remaining = 420 - m;
                  }

                  else if (m >= 660 && m < 1020) {
                    end = new Date(now);
                    end.setHours(17,0,0,0);
                    remaining = 1020 - m;
                  }

                  else if (m >= 1320) {
                    end = new Date(now);
                    end.setDate(end.getDate() + 1);
                    end.setHours(7,0,0,0);
                    remaining = (1440 - m) + 420;
                  }

                  let display = '--:--';
                  let label = 'PROCHAIN DÉPART';

                  // 22h → 23h : première chauffe prévue à 23h
                  if (m >= 1320 && m < 1380) {

                    const d = new Date(now);
                    d.setHours(23,0,0,0);

                    display = '23:00';
                    label = 'CHARGE INITIALE';
                  }

                  // 23h → 23h20 : chauffe en cours / prévue maintenant
                  else if (m >= 1380 && m < 1400) {

                    display = 'NOW';
                    label = 'CHARGE INITIALE';
                  }

                  // 23h20 → 23h50 : on ne prétend pas encore connaître
                  // précisément le failback tant que la sonde se stabilise
                  else if (m >= 1400 && m < 1430) {

                    display = '23:50';
                    label = 'RECALCUL APRÈS STABILISATION';
                  }

                  // Après stabilisation : vrai calcul failback
                  else if (end && remaining !== null) {

                    const tEnd = t - loss * remaining / 60;

                    const heating =
                      Math.max(0, (target - tEnd) / heat * 60);

                    const start =
                      new Date(end.getTime() - (heating + margin) * 60000);

                    display =
                      String(start.getHours()).padStart(2,'0')
                      + ':'
                      + String(start.getMinutes()).padStart(2,'0');

                    label = 'DÉMARRAGE FAILBACK';
                  }

                  return `
                    <div class="main-value">${display}</div>
                    <div class="main-label">${label}</div>
                  `;
                ]]]
              temp: |
                [[[
                  const t = parseFloat(
                    states['[[foxcat:boiler.temperature_source]]']?.state || 0
                  );

                  return `
                    <div class="mini-value">${t.toFixed(1)}°</div>
                    <div class="mini-label">TEMPÉRATURE</div>
                  `;
                ]]]
              heat_time: |
                [[[
                  const t = parseFloat(
                    states['[[foxcat:boiler.temperature_source]]']?.state || 0
                  );

                  const target = parseFloat(
                    states['[[foxcat:legacy.input_number_ems_boiler_temp_normal]]']?.state || 45
                  );

                  const now = new Date();
                  const m = now.getHours() * 60 + now.getMinutes();

                  let remaining = null;

                  if (m < 420)
                    remaining = 420 - m;

                  else if (m >= 660 && m < 1020)
                    remaining = 1020 - m;

                  else if (m >= 1320)
                    remaining = (1440 - m) + 420;

                  if (remaining === null) {
                    return `
                      <div class="mini-value">--</div>
                      <div class="mini-label">CHAUFFE NÉCESSAIRE</div>
                    `;
                  }

                  const tEnd = t - 0.5 * remaining / 60;

                  const heating =
                    Math.max(0, (target - tEnd) / 10 * 60);

                  const h = Math.floor(heating / 60);
                  const min = Math.round(heating % 60);

                  const txt =
                    h > 0
                      ? `${h}h${String(min).padStart(2,'0')}`
                      : `${Math.round(heating)} min`;

                  return `
                    <div class="mini-value">${txt}</div>
                    <div class="mini-label">CHAUFFE NÉCESSAIRE</div>
                  `;
                ]]]
              temp_end: |
                [[[
                  const t = parseFloat(
                    states['[[foxcat:boiler.temperature_source]]']?.state || 0
                  );

                  const now = new Date();
                  const m = now.getHours() * 60 + now.getMinutes();

                  let remaining = null;

                  if (m < 420)
                    remaining = 420 - m;

                  else if (m >= 660 && m < 1020)
                    remaining = 1020 - m;

                  else if (m >= 1320)
                    remaining = (1440 - m) + 420;

                  if (remaining === null) {
                    return `
                      <div class="mini-value">--</div>
                      <div class="mini-label">T° FIN HC</div>
                    `;
                  }

                  const tEnd = t - 0.5 * remaining / 60;

                  return `
                    <div class="mini-value">${tEnd.toFixed(1)}°</div>
                    <div class="mini-label">T° FIN HC</div>
                  `;
                ]]]
              end_hc: |
                [[[
                  const now = new Date();
                  const m = now.getHours() * 60 + now.getMinutes();

                  let txt = '--:--';

                  if (m < 420 || m >= 1320)
                    txt = '07:00';

                  else if (m >= 660 && m < 1020)
                    txt = '17:00';

                  return `
                    <div class="mini-value">${txt}</div>
                    <div class="mini-label">FIN HC</div>
                  `;
                ]]]
              failback: |
                [[[
                  const t = parseFloat(
                    states['[[foxcat:boiler.temperature_source]]']?.state || 0
                  );

                  const target = parseFloat(
                    states['[[foxcat:legacy.input_number_ems_boiler_temp_normal]]']?.state || 45
                  );

                  const now = new Date();
                  const m = now.getHours() * 60 + now.getMinutes();

                  if (m >= 1400 && m < 1430) {
                    return `
                      <div class="fail-value">STABILISATION</div>
                      <div class="fail-label">
                        recalcul thermique à 23:50
                      </div>
                    `;
                  }

                  let remaining = null;

                  if (m < 420)
                    remaining = 420 - m;

                  else if (m >= 660 && m < 1020)
                    remaining = 1020 - m;

                  else if (m >= 1320)
                    remaining = (1440 - m) + 420;

                  if (remaining === null) {
                    return `
                      <div class="fail-value">HORS HC</div>
                      <div class="fail-label">failback inactif</div>
                    `;
                  }

                  const tEnd = t - 0.5 * remaining / 60;

                  const heating =
                    Math.max(0, (target - tEnd) / 10 * 60);

                  const before =
                    remaining - heating - 30;

                  if (before <= 0) {
                    return `
                      <div class="fail-value">FAILBACK ACTIF</div>
                      <div class="fail-label">chauffe nécessaire maintenant</div>
                    `;
                  }

                  const h = Math.floor(before / 60);
                  const min = Math.round(before % 60);

                  const txt =
                    h > 0
                      ? `${h}h${String(min).padStart(2,'0')}`
                      : `${Math.round(before)} min`;

                  return `
                    <div class="fail-value">${txt}</div>
                    <div class="fail-label">
                      avant dernier départ thermique
                    </div>
                  `;
                ]]]
            styles:
              card:
                - padding: 20px
                - border-radius: 28px
                - border: 1px solid rgba(255,255,255,0.08)
                - box-shadow: 0 18px 45px rgba(0,0,0,0.28)
                - background: |
                    [[[
                      const now = new Date();
                      const m = now.getHours() * 60 + now.getMinutes();

                      const demand =
                        states['[[foxcat:legacy.input_select_ems_boiler_demande]]']?.state || '';

                      if (demand === 'CHAUFFE_45')
                        return 'linear-gradient(145deg, rgba(115,67,10,.95), rgba(11,18,32,.98))';

                      if (m >= 1400 && m < 1430)
                        return 'linear-gradient(145deg, rgba(45,42,90,.94), rgba(11,18,32,.98))';

                      if (m >= 1320 || m < 420)
                        return 'linear-gradient(145deg, rgba(12,61,76,.96), rgba(11,18,32,.98))';

                      return 'linear-gradient(145deg, rgba(17,27,46,.96), rgba(11,18,32,.98))';
                    ]]]
              grid:
                - grid-template-areas: |
                    "header header header"
                    "time_now time_now next_start"
                    "temp heat_time temp_end"
                    "end_hc end_hc end_hc"
                    "failback failback failback"
                - grid-template-columns: 1fr 1fr 1fr
                - grid-template-rows: auto auto auto auto auto
                - gap: 14px
              custom_fields:
                header:
                  - width: 100%
                time_now:
                  - text-align: left
